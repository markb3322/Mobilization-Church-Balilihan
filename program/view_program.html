
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Program Details | MCB Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,700;1,400&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root { --p-indigo: #4f46e5; --p-slate: #1e293b; --bulletin-bg: #ffffff; }
        body { 
            background: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            color: #334155; 
            padding-bottom: 80px;
            overflow-x: hidden;
        }
        
        /* Main container with horizontal scroll for mobile */
        .main-wrapper {
            width: 100%;
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
        }
        
        .container-custom {
            min-width: 320px;
            width: 100%;
            padding: 0 20px;
            margin: 0 auto;
        }
        
        @media (min-width: 768px) {
            .main-wrapper {
                overflow-x: visible;
            }
            .container-custom {
                max-width: 1200px;
                margin: 0 auto;
            }
        }
        
        .design-toolbar {
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            padding: 18px; 
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); 
            margin-bottom: 25px;
            position: sticky; 
            top: 20px; 
            z-index: 900;
            width: 100%;
            min-width: 300px;
        }
        
        .tools-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
        }
        
        @media (min-width: 768px) { 
            .tools-grid { 
                grid-template-columns: repeat(6, 1fr); 
            } 
        }
        
        .tool-label { 
            font-size: 0.65rem; 
            font-weight: 800; 
            color: #94a3b8; 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 5px; 
        }
        .tool-select, .tool-color, .tool-range { 
            border-radius: 10px; 
            border: 1px solid #e2e8f0; 
            height: 38px; 
            width: 100%; 
        }

        .btn-icon { 
            height: 38px; 
            width: 100%; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s; 
            cursor: pointer; 
            background: #f1f5f9; 
            border: none; 
        }
        .btn-icon:hover { transform: translateY(-2px); background: #e2e8f0; }
        .btn-dark { background: #1e293b; color: white; }
        .btn-dark:hover { background: #0f172a; }

        /* Bulletin wrapper with horizontal scroll for mobile */
        .bulletin-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
        }
        
        .size-a4 { width: 210mm; min-height: 290mm; }
        .size-short { width: 216mm; min-height: 279mm; }
        .size-long { width: 216mm; min-height: 330mm; }
        .size-legal { width: 216mm; min-height: 356mm; }
        
        @media (max-width: 768px) {
            .size-a4, .size-short, .size-long, .size-legal {
                width: 100%;
                min-width: 320px;
            }
        }

        #programBulletin {
            background: var(--bulletin-bg); 
            margin: 10px auto; 
            padding: 30px 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08); 
            position: relative;
            border: 1px solid #f1f5f9; 
            font-size: 15px;
            background: white;
        }
        
        @media (max-width: 768px) {
            #programBulletin {
                padding: 15px 20px;
                margin: 0 auto;
            }
        }
        
        .bulletin-header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid var(--p-slate); padding-bottom: 15px; position: relative; }
        .header-main-content { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 5px; flex-wrap: wrap; }
        .church-logo { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 2px solid #f1f5f9; }
        .title-wrapper { text-align: left; }

        .church-main-title { font-family: 'Cinzel', serif; font-size: 180%; color: var(--p-slate); margin: 0; line-height: 1.1; }
        .church-sub-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 85%; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 2px; }
        .program-type-title { font-family: 'Cinzel', serif; font-size: 160%; color: var(--p-indigo); margin-top: 15px; letter-spacing: 3px; font-weight: 800; }
        
        .header-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding: 5px 0; font-family: 'Plus Jakarta Sans', sans-serif; flex-wrap: wrap; gap: 10px; }
        .meta-mc { font-weight: 800; font-size: 75%; color: #475569; border-left: 3px solid var(--p-indigo); padding-left: 8px; text-align: left; }
        .meta-date { font-weight: 800; font-size: 75%; color: #475569; border-right: 3px solid var(--p-indigo); padding-right: 8px; text-align: right; }

        .b-section { margin-bottom: 10px; }
        .b-title { 
            font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 85%; 
            text-transform: uppercase; color: var(--p-indigo); border-bottom: 1px solid #f1f5f9;
            margin-bottom: 5px; padding-bottom: 2px; letter-spacing: 1px;
        }
        .b-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; flex-wrap: wrap; gap: 5px; }
        .b-row-center { display: block; text-align: center; margin-bottom: 5px; }
        .b-dotted { flex-grow: 1; border-bottom: 1px dotted #cbd5e1; margin: 0 8px; opacity: 0.4; min-width: 30px; }
        .b-label { font-weight: 600; font-size: 95%; color: #475569; }
        .b-value { font-weight: 500; text-align: right; font-size: 95%; color: #1e293b; }
        
        .speaker-highlight { 
            font-family: 'Playfair Display', serif; font-weight: 700; font-size: 160%; 
            color: var(--p-indigo); margin: 0;
        }

        .communion-box { border: 1px dashed #cbd5e1; padding: 8px; border-radius: 8px; background: #fafafa; }
        .bible-verse-section { text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #f1f5f9; }

        .bulletin-footer {
            margin-top: 15px; padding-top: 10px; border-top: 1px solid #f1f5f9;
            text-align: center; font-size: 65%; color: #94a3b8; font-weight: 600;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid #e2e8f0;
            padding: 8px 20px;
            border-radius: 40px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        .back-btn:hover { background: #f1f5f9; transform: translateY(-2px); }

        @media print { 
            body { background: white !important; margin: 0; padding: 0; overflow-x: visible; }
            .no-print, .navbar, nav, .design-toolbar, .back-btn, .main-wrapper { display: none !important; } 
            .container-custom { max-width: 100% !important; width: 100% !important; padding: 0 !important; margin: 0 !important; }
            #programBulletin { 
                box-shadow: none !important; margin: 0 !important; border: none !important;
                padding: 10mm 15mm !important; width: 100% !important; height: auto !important;
            } 
            @page { margin: 0; size: auto; }
        }
        
        @media (max-width: 768px) {
            .design-toolbar { padding: 12px; position: relative; top: 0; }
            .header-main-content { flex-direction: column; text-align: center; }
            .title-wrapper { text-align: center; }
            .church-logo { width: 60px; height: 60px; }
            .church-main-title { font-size: 120%; }
            .program-type-title { font-size: 120%; }
            .b-row { flex-direction: column; align-items: flex-start; }
            .b-dotted { display: none; }
            .b-value { text-align: left; }
            .header-meta { flex-direction: column; align-items: center; text-align: center; }
            .meta-mc, .meta-date { border: none; text-align: center; }
        }
    </style>
</head>
<body>

<div id="navbar-container"></div>

<div class="main-wrapper">
    <div class="container-custom">
        <a href="table.html" class="back-btn no-print"><i class="fas fa-arrow-left"></i> Back to Records</a>
        
        <div class="design-toolbar no-print">
            <div class="tools-grid">
                <div class="tool-group">
                    <span class="tool-label">Font</span>
                    <select id="fontStyle" class="tool-select">
                        <option value="'Inter', sans-serif">Modern</option>
                        <option value="'Playfair Display', serif">Classic</option>
                        <option value="'Plus Jakarta Sans', sans-serif">Clean</option>
                        <option value="'Cinzel', serif">Royal</option>
                    </select>
                </div>
                <div class="tool-group">
                    <span class="tool-label">Size <span id="sizeVal">100</span>%</span>
                    <input type="range" id="fontSlider" class="tool-range form-range" min="50" max="150" value="100">
                </div>
                <div class="tool-group">
                    <span class="tool-label">Paper</span>
                    <select id="paperSize" class="tool-select">
                        <option value="size-a4">A4</option>
                        <option value="size-short">Short</option>
                        <option value="size-long">Long</option>
                        <option value="size-legal">Legal</option>
                    </select>
                </div>
                <div class="tool-group">
                    <span class="tool-label">Color</span>
                    <input type="color" id="fontColor" class="tool-color" value="#4f46e5">
                </div>
                <div class="tool-group">
                    <span class="tool-label">MS Word</span>
                    <button id="exportWord" class="btn-icon"><i class="fas fa-file-word"></i> Word</button>
                </div>
                <div class="tool-group">
                    <span class="tool-label">Save</span>
                    <button id="downloadImage" class="btn-icon btn-dark"><i class="fas fa-camera"></i> Image</button>
                </div>
            </div>
        </div>

        <div class="bulletin-wrapper">
            <div id="programBulletin" class="size-a4">
                <div id="targetContent">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status"></div>
                        <p class="mt-3">Loading program data...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="navbar_program.js"></script>

<script>
    const SUPABASE_URL = 'https://ypynnkupszfgqoxyirff.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweW5ua3Vwc3pmZ3FveHlpcmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODYwNjcsImV4cCI6MjA5Mjk2MjA2N30.aHfVKPLM9Yr2ck6A8MAfXHishoq0JaCbVnHNMF0Okqk';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let programData = null;
    let currentUserId = null;
    
    // Get current user from session
    try {
        const session = localStorage.getItem('mcb_user_session') || sessionStorage.getItem('mcb_user_session');
        if (session) {
            const user = JSON.parse(session);
            currentUserId = user.id;
        }
    } catch(e) {}
    
    function getProgramIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }
    
    function isFirstSunday(dateStr) {
        if (!dateStr) return false;
        const date = new Date(dateStr);
        const day = date.getDate();
        const dayOfWeek = date.getDay();
        return day <= 7 && dayOfWeek === 0;
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return 'TBA';
        try {
            return new Date(dateStr).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
        } catch(e) {
            return dateStr;
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    async function loadProgram() {
        const programId = getProgramIdFromUrl();
        
        if (!programId) {
            document.getElementById('targetContent').innerHTML = `
                <div class="text-center py-5 text-danger">
                    <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                    <h5>No Program ID Provided</h5>
                    <p>Please go back and select a program to view.</p>
                </div>
            `;
            return;
        }
        
        try {
            const { data, error } = await supabaseClient
                .from('church_programs')
                .select('*')
                .eq('program_id', programId)
                .single();
            
            if (error) throw error;
            if (!data) throw new Error('Program not found');
            
            programData = data;
            
            let creatorName = "Unknown";
            if (programData.user_id) {
                const { data: userData } = await supabaseClient
                    .from('church_users')
                    .select('full_name')
                    .eq('id', programData.user_id)
                    .single();
                if (userData) creatorName = userData.full_name;
            }
            
            const isFirstSun = isFirstSunday(programData.service_date);
            const formattedDate = formatDate(programData.service_date);
            const programIdPadded = programData.id ? String(programData.id).padStart(5, '0') : '00001';
            
            const html = `
                <div class="bulletin-header">
                    <div class="header-main-content">
                        <img src="image/mcb.jpg" alt="MCB Logo" class="church-logo" onerror="this.src='https://ui-avatars.com/api/?name=MCB&background=4f46e5&color=fff&size=80&bold=true'">
                        <div class="title-wrapper">
                            <h1 class="church-main-title">Mobilization Church Balilihan</h1>
                            <div class="church-sub-title">Saling, Balilihan, Bohol</div>
                        </div>
                    </div>
                    <h2 class="program-type-title">SUNDAY PROGRAM</h2>
                    <div class="header-meta">
                        <div class="meta-mc">MC: ${escapeHtml((programData.mc_name || programData.mc_name_auto || 'TBA').toUpperCase())}</div>
                        <div class="meta-date">DATE: ${formattedDate}</div>
                    </div>
                </div>

                <div class="program-flow">
                    <div class="b-section">
                        <div class="b-title">Part I: Sunday School</div>
                        <div class="b-row">
                            <span class="b-label">Teacher</span>
                            <div class="b-dotted"></div>
                            <span class="b-value fw-bold">${escapeHtml(programData.sunday_school_teacher || 'TBA')}</span>
                        </div>
                    </div>

                    <div class="b-section">
                        <div class="b-title">Part II: Sunday Service</div>
                        <div class="b-row-center">
                            <div class="b-label">Welcome Address</div>
                            <div class="b-value text-center w-100 fw-bold">${escapeHtml(programData.welcome_message || 'Assigned')}</div>
                        </div>
                        <div class="b-row-center">
                            <div class="b-label">Testimony</div>
                            <div class="b-value text-center w-100 fw-bold">${escapeHtml(programData.testimony_verse || 'Church Member')}</div>
                        </div>
                        <div class="b-row"><span class="b-label">Scripture</span><div class="b-dotted"></div><span class="b-value">${escapeHtml(programData.bible_reader_name || 'TBA')}</span></div>
                        <div class="b-row"><span class="b-label">Opening Song</span><div class="b-dotted"></div><span class="b-value">${escapeHtml(programData.worship_team || 'TBA')}</span></div>
                        <div class="b-row"><span class="b-label">Opening Prayer</span><div class="b-dotted"></div><span class="b-value">${escapeHtml(programData.prayer_leader_name || 'TBA')}</span></div>
                    </div>

                    <div class="b-section">
                        <div class="b-title">Praise and Worship</div>
                        <div class="b-row"><span class="b-label">Worship Leader</span><div class="b-dotted"></div><span class="b-value fw-bold">${escapeHtml(programData.worship_lead_name || 'Praise Team')}</span></div>
                    </div>

                    <div class="b-section text-center">
                        <div class="b-title text-start">The Word of God</div>
                        <span style="font-size: 70%; color: #94a3b8; text-transform: uppercase;">Host Pastor</span>
                        <h2 class="speaker-highlight">${escapeHtml((programData.host_pastor_name || 'TBA').toUpperCase())}</h2>
                    </div>

                    <div class="b-section communion-box text-center">
                        <div class="b-title text-start" style="border:none; margin-bottom:2px;">The Holy Communion</div>
                        ${isFirstSun ? `
                            <p class="mb-0" style="font-size: 85%;"><em>"Do this in remembrance of Me."</em></p>
                            <span class="fw-bold text-primary" style="font-size:85%;">Officiating: ${escapeHtml(programData.officiating_pastor_name || 'Pastor / Elders')}</span>
                        ` : `
                            <p class="mb-0 text-muted" style="font-size: 80%;"><em>Observed every 1st Sunday of the Month</em></p>
                        `}
                    </div>

                    <div class="b-section">
                        <div class="b-title">Tithes and Offering</div>
                        <div class="b-row"><span class="b-label">Presentation</span><div class="b-dotted"></div><span class="b-value">${escapeHtml(programData.exhortation_name || 'TBA')}</span></div>
                        <div class="b-row"><span class="b-label">Prayer and Exhortation</span><div class="b-dotted"></div><span class="b-value">${escapeHtml(programData.presentation_name || 'Assigned')}</span></div>
                    </div>

                    <div class="b-section">
                        <div class="b-title">Public Announcements</div>
                        <div style="font-size: 85%; padding-left: 10px; border-left: 2px solid #e2e8f0; font-style: italic; color: #64748b;">
                            ${escapeHtml(programData.announcement) || 'Refer to the bulletin board for more details.'}
                        </div>
                    </div>

                    <div class="b-section">
                        <div class="b-title">Closing Services</div>
                        <div class="b-row"><span class="b-label">Closing Song</span><div class="b-dotted"></div><span class="b-value">${escapeHtml(programData.closing_worship_team || 'Congregation')}</span></div>
                        <div class="b-row"><span class="b-label">Benediction</span><div class="b-dotted"></div><span class="b-value">${escapeHtml(programData.closing_prayer_name || 'Minister / Pastor')}</span></div>
                    </div>

                    <div class="b-section">
                        <div class="b-title">Part III: Fellowship</div>
                        <div class="text-center py-1" style="font-size: 90%; color: #475569;">
                            <span class="fw-bold"><i class="fas fa-utensils me-2"></i> Lunch</span> &nbsp; | &nbsp; 
                            <span class="fw-bold"><i class="fas fa-camera me-2"></i> Picture Taking</span> &nbsp; | &nbsp; 
                            <span class="fw-bold"><i class="fas fa-users me-2"></i> Bonding</span>
                        </div>
                    </div>

                    <div class="bible-verse-section">
                        <div style="font-size: 100%; color: #475569; font-style: italic;">"Let everything that has breath praise the LORD."</div>
                        <small class="fw-bold text-primary">Psalm 150:6</small>
                    </div>
                </div>
                
                <div class="bulletin-footer">
                    MCB Portal Pro | System User: ${escapeHtml(creatorName)} | ID: #${programIdPadded}
                </div>
            `;
            
            document.getElementById('targetContent').innerHTML = html;
            
        } catch (err) {
            console.error('Load error:', err);
            document.getElementById('targetContent').innerHTML = `
                <div class="text-center py-5 text-danger">
                    <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                    <h5>Error Loading Program</h5>
                    <p>${err.message}</p>
                </div>
            `;
        }
    }
    
    // Toolbar functions
    document.getElementById('fontSlider')?.addEventListener('input', function() {
        const percentage = this.value;
        document.getElementById('sizeVal').textContent = percentage;
        const newBaseSize = (15 * (percentage / 100)) + "px";
        document.getElementById('programBulletin').style.fontSize = newBaseSize;
    });
    
    document.getElementById('fontStyle')?.addEventListener('change', function() {
        document.getElementById('targetContent').style.fontFamily = this.value;
    });
    
    document.getElementById('fontColor')?.addEventListener('input', function() {
        const color = this.value;
        const elements = document.querySelectorAll('.b-title, .speaker-highlight, .program-type-title, .text-primary');
        elements.forEach(el => el.style.color = color);
    });
    
    document.getElementById('paperSize')?.addEventListener('change', function() {
        const bulletin = document.getElementById('programBulletin');
        bulletin.classList.remove('size-a4', 'size-long', 'size-short', 'size-legal');
        bulletin.classList.add(this.value);
    });
    
    document.getElementById('exportWord')?.addEventListener('click', function() {
        const content = document.getElementById('programBulletin').cloneNode(true);
        const styles = `
            <style>
                body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0.7in; }
                .bulletin-header { border-bottom: 2px solid #333; margin-bottom: 20px; text-align: center; }
                .church-logo { width: 60px; height: 60px; }
                .church-main-title { font-size: 20pt; font-weight: bold; }
                .program-type-title { font-size: 18pt; color: #4f46e5; margin-top: 10px; }
                .b-title { font-weight: bold; border-bottom: 1px solid #ccc; margin-top: 10px; color: #4f46e5; text-transform: uppercase; }
                .b-row { margin: 5px 0; display: flex; justify-content: space-between; }
                .b-dotted { flex-grow: 1; border-bottom: 1px dotted #ccc; margin: 0 8px; }
                .design-toolbar, .no-print, .back-btn { display: none; }
            </style>
        `;
        const html = `<!DOCTYPE html>
        <html>
        <head><meta charset="utf-8">${styles}</head>
        <body>${content.innerHTML}</body>
        </html>`;
        const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `MCB_Sunday_Program_${programData?.program_id || 'view'}.doc`;
        link.click();
        URL.revokeObjectURL(url);
    });
    
    document.getElementById('downloadImage')?.addEventListener('click', function() {
        const btn = this;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        
        html2canvas(document.getElementById('programBulletin'), { 
            scale: 3, 
            useCORS: true, 
            backgroundColor: "#ffffff" 
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `MCB_Sunday_Program_${programData?.program_id || 'view'}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }).catch(err => {
            console.error('Capture error:', err);
            btn.innerHTML = originalHtml;
            btn.disabled = false;
            alert('Error capturing image. Please try again.');
        });
    });
    
    loadProgram();
</script>
</body>
</html>
