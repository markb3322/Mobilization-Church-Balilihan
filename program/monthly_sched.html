<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Monthly Schedule | MCB Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root { --primary: #4f46e5; --dark: #1e293b; }
        body { background: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 80px; }

        /* Header with Download Button */
        .page-header {
            max-width: 1000px;
            margin: 20px auto 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header-title h1 {
            font-family: 'Cinzel', serif;
            color: var(--dark);
            font-size: 1.8rem;
            margin-bottom: 0;
        }
        
        .header-title p {
            color: var(--primary);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.75rem;
            margin-bottom: 0;
        }
        
        .btn-download-top {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 25px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
        }
        
        .btn-download-top:hover {
            transform: translateY(-2px);
            background: #4338ca;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
        }
        
        .btn-download-top:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Filter Bar */
        .filter-bar {
            max-width: 1000px;
            margin: 20px auto 0 auto;
            padding: 15px 20px;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .filter-label {
            font-weight: 700;
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .filter-select {
            padding: 8px 15px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.85rem;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .filter-badge {
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        /* HD Container for Image Export */
        .export-container {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            background: white;
            padding: 40px;
            position: relative;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Background Design / Watermark */
        .export-container::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: url('./image/mcb.jpg') no-repeat center;
            background-size: contain;
            opacity: 0.05;
            z-index: 0;
        }

        .schedule-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .schedule-header h1 {
            font-family: 'Cinzel', serif;
            color: var(--dark);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .schedule-header p {
            color: var(--primary);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .monthly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .sunday-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .date-badge {
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 5px;
        }

        .info-label { font-size: 0.75rem; color: #64748b; font-weight: 700; text-transform: uppercase; }
        .info-value { font-size: 0.95rem; color: var(--dark); font-weight: 600; }

        .footer-branding {
            margin-top: 50px;
            text-align: center;
            padding-top: 20px;
            border-top: 2px solid #f1f5f9;
            font-size: 0.75rem;
            color: #94a3b8;
            position: relative;
            z-index: 1;
        }

        .loading-card {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 20px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 20px;
            color: #64748b;
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                text-align: center;
                margin-top: 10px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
                margin: 10px auto;
            }
            .filter-group {
                justify-content: space-between;
            }
            .export-container { padding: 20px; margin: 10px; }
            .monthly-grid { grid-template-columns: 1fr; }
            .schedule-header h1 { font-size: 1.5rem; }
            .schedule-header img { width: 50px; }
            .btn-download-top { padding: 8px 20px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div id="navbar-container"></div>

<div class="page-header">
    <div class="header-title">
        <h1>Monthly Schedule</h1>
        <p>Mobilization Church Balilihan</p>
    </div>
    <button id="downloadHD" class="btn-download-top no-print">
        <i class="fas fa-download me-2"></i> Download as Image
    </button>
</div>

<div class="filter-bar no-print">
    <div class="filter-group">
        <span class="filter-label"><i class="fas fa-filter"></i> Filter by:</span>
        <select id="filterType" class="filter-select">
            <option value="all">📅 All Programs</option>
            <option value="month">📆 Select Month</option>
            <option value="week">📊 Select Week</option>
        </select>
    </div>
    
    <div class="filter-group" id="monthSelectGroup" style="display: none;">
        <span class="filter-label">Month:</span>
        <select id="monthSelect" class="filter-select">
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
        </select>
    </div>
    
    <div class="filter-group" id="weekSelectGroup" style="display: none;">
        <span class="filter-label">Week:</span>
        <select id="weekSelect" class="filter-select">
            <option value="1">Week 1 (Days 1-7)</option>
            <option value="2">Week 2 (Days 8-14)</option>
            <option value="3">Week 3 (Days 15-21)</option>
            <option value="4">Week 4 (Days 22-28)</option>
            <option value="5">Week 5 (Days 29-31)</option>
        </select>
    </div>
    
    <div class="filter-group">
        <span class="filter-badge" id="filterBadge">Showing: All Programs</span>
    </div>
</div>

<div id="captureArea" class="export-container">
    <div class="schedule-header">
        <img src="./image/mcb.jpg" width="80" alt="MCB Logo" class="mb-3" style="border-radius: 50%;" onerror="this.src='https://ui-avatars.com/api/?name=MCB&background=4f46e5&color=fff&size=80&bold=true'">
        <h1>Monthly Schedule</h1>
        <p>Mobilization Church Balilihan</p>
        <div id="filterDisplay" class="mt-2" style="font-size: 0.85rem; color: var(--primary); font-weight: 600;"></div>
    </div>

    <div id="programsContainer" class="monthly-grid">
        <div class="loading-card">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-3">Loading programs...</p>
        </div>
    </div>

    <div class="footer-branding">
        <div class="row align-items-center">
            <div class="col-md-4 mb-2 mb-md-0">MCB Portal Pro</div>
            <div class="col-md-4 mb-2 mb-md-0">System User: <strong id="userName">Loading...</strong></div>
            <div class="col-md-4">UID: #<span id="userId">---</span></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="navbar_program.js"></script>

<script>
    const SUPABASE_URL = 'https://ypynnkupszfgqoxyirff.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweW5ua3Vwc3pmZ3FveHlpcmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODYwNjcsImV4cCI6MjA5Mjk2MjA2N30.aHfVKPLM9Yr2ck6A8MAfXHishoq0JaCbVnHNMF0Okqk';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUserId = null;
    let currentUserFullName = null;
    let allPrograms = [];
    let currentFilter = 'all';
    let currentMonth = new Date().getMonth() + 1;
    let currentWeek = 1;
    
    // Get current user from session
    async function getCurrentUser() {
        try {
            const session = localStorage.getItem('mcb_user_session') || sessionStorage.getItem('mcb_user_session');
            if (session) {
                const user = JSON.parse(session);
                currentUserId = user.id;
                currentUserFullName = user.full_name || user.name || 'Church Member';
                
                document.getElementById('userName').innerText = currentUserFullName;
                document.getElementById('userId').innerText = String(currentUserId).padStart(5, '0');
                
                const { data } = await supabaseClient
                    .from('church_users')
                    .select('full_name')
                    .eq('id', currentUserId)
                    .single();
                
                if (data && data.full_name) {
                    currentUserFullName = data.full_name;
                    document.getElementById('userName').innerText = currentUserFullName;
                }
                
                return true;
            }
        } catch(e) {
            console.log("Error reading session:", e);
        }
        
        document.getElementById('userName').innerText = 'Guest';
        document.getElementById('userId').innerText = '---';
        return false;
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return 'TBA';
        try {
            return new Date(dateStr).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
        } catch(e) {
            return dateStr;
        }
    }
    
    function formatShortDate(dateStr) {
        if (!dateStr) return 'TBA';
        try {
            return new Date(dateStr).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
        } catch(e) {
            return dateStr;
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function getWeekOfMonth(date) {
        const day = date.getDate();
        if (day <= 7) return 1;
        if (day <= 14) return 2;
        if (day <= 21) return 3;
        if (day <= 28) return 4;
        return 5;
    }
    
    function filterPrograms() {
        const filterType = document.getElementById('filterType').value;
        let filtered = [...allPrograms];
        let filterText = '';
        
        if (filterType === 'month') {
            const selectedMonth = parseInt(document.getElementById('monthSelect').value);
            currentMonth = selectedMonth;
            filtered = allPrograms.filter(p => {
                if (!p.service_date) return false;
                const date = new Date(p.service_date);
                return date.getMonth() + 1 === selectedMonth;
            });
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            filterText = `Month: ${monthNames[selectedMonth - 1]}`;
            document.getElementById('filterBadge').innerHTML = `Showing: ${monthNames[selectedMonth - 1]}`;
        } 
        else if (filterType === 'week') {
            const selectedWeek = parseInt(document.getElementById('weekSelect').value);
            currentWeek = selectedWeek;
            filtered = allPrograms.filter(p => {
                if (!p.service_date) return false;
                const date = new Date(p.service_date);
                return getWeekOfMonth(date) === selectedWeek;
            });
            filterText = `Week ${selectedWeek} of Month`;
            document.getElementById('filterBadge').innerHTML = `Showing: Week ${selectedWeek}`;
        } 
        else {
            filterText = 'All Programs';
            document.getElementById('filterBadge').innerHTML = 'Showing: All Programs';
        }
        
        // Sort by date
        filtered.sort((a, b) => new Date(a.service_date) - new Date(b.service_date));
        
        document.getElementById('filterDisplay').innerHTML = filterText ? `<i class="fas fa-calendar-alt me-1"></i> ${filterText}` : '';
        
        displayPrograms(filtered);
    }
    
    function displayPrograms(programs) {
        const container = document.getElementById('programsContainer');
        
        if (programs.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-calendar-day fa-3x mb-3"></i>
                    <h5>No Programs Found</h5>
                    <p>No Sunday programs available for the selected filter.</p>
                    <a href="add_program.html" class="btn btn-primary mt-3">Add New Program</a>
                </div>
            `;
            return;
        }
        
        let html = '';
        
        programs.forEach(program => {
            const serviceDate = formatDate(program.service_date);
            const shortDate = formatShortDate(program.service_date);
            const mcName = program.mc_name || program.mc_name_auto || 'TBA';
            const speaker = program.host_pastor_name || program.speaker || 'TBA';
            
            html += `
                <div class="sunday-card">
                    <div class="date-badge">
                        <i class="far fa-calendar-alt me-2"></i>
                        ${shortDate}
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Master of Ceremony</span>
                        <span class="info-value">${escapeHtml(mcName)}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">Host Pastor and Elders</span>
                        <span class="info-value">${escapeHtml(speaker)}</span>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
    }
    
    async function fetchPrograms() {
        const container = document.getElementById('programsContainer');
        
        if (!currentUserId) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-lock fa-3x mb-3"></i>
                    <h5>Login Required</h5>
                    <p>Please login to view your monthly schedule.</p>
                    <a href="../login.html" class="btn btn-primary mt-3">Go to Login</a>
                </div>
            `;
            return;
        }
        
        try {
            const { data, error } = await supabaseClient
                .from('church_programs')
                .select('*')
                .eq('user_id', currentUserId)
                .order('service_date', { ascending: true });
            
            if (error) throw error;
            
            allPrograms = data || [];
            filterPrograms();
            
        } catch (err) {
            console.error('Fetch error:', err);
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                    <h5>Error Loading Data</h5>
                    <p>${err.message}</p>
                    <button class="btn btn-primary mt-3" onclick="fetchPrograms()">Try Again</button>
                </div>
            `;
        }
    }
    
    // Filter change handlers
    function setupFilters() {
        const filterType = document.getElementById('filterType');
        const monthGroup = document.getElementById('monthSelectGroup');
        const weekGroup = document.getElementById('weekSelectGroup');
        const monthSelect = document.getElementById('monthSelect');
        const weekSelect = document.getElementById('weekSelect');
        
        filterType.addEventListener('change', function() {
            currentFilter = this.value;
            
            if (this.value === 'month') {
                monthGroup.style.display = 'flex';
                weekGroup.style.display = 'none';
                filterPrograms();
            } else if (this.value === 'week') {
                monthGroup.style.display = 'none';
                weekGroup.style.display = 'flex';
                filterPrograms();
            } else {
                monthGroup.style.display = 'none';
                weekGroup.style.display = 'none';
                filterPrograms();
            }
        });
        
        monthSelect.addEventListener('change', filterPrograms);
        weekSelect.addEventListener('change', filterPrograms);
        
        // Set current month as default
        const currentMonthValue = new Date().getMonth() + 1;
        monthSelect.value = currentMonthValue;
    }
    
    // Download HD Image
    async function downloadHDImage() {
        const btn = document.getElementById('downloadHD');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Processing...';
        btn.disabled = true;

        const captureElement = document.getElementById('captureArea');
        
        try {
            const canvas = await html2canvas(captureElement, {
                scale: 3,
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#ffffff",
                logging: false
            });
            
            const link = document.createElement('a');
            const date = new Date();
            const monthYear = date.toLocaleDateString('en-PH', { month: 'short', year: 'numeric' });
            link.download = `MCB_Schedule_${monthYear}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
            
        } catch (err) {
            console.error('Capture error:', err);
            alert('Error capturing image. Please try again.');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }
    
    // Initialize
    async function init() {
        await getCurrentUser();
        setupFilters();
        await fetchPrograms();
        
        document.getElementById('downloadHD').addEventListener('click', downloadHDImage);
    }
    
    init();
</script>

</body>
    </html>
