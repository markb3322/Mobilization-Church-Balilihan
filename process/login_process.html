<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Login | Mobilization Church Balilihan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            font-family: 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .processing-container {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .processing-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: none;
            text-align: center;
            padding: 40px 30px;
        }

        .cross-icon {
            font-size: 4rem;
            color: #38bdf8;
            margin-bottom: 20px;
            display: inline-block;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }

        h2 {
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 25px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            color: #475569;
            font-size: 0.95rem;
            margin-top: 15px;
        }

        .alert-box {
            background: #fef2f2;
            border-left: 4px solid #ef4444;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: left;
        }

        .btn-back {
            background: linear-gradient(95deg, #0f172a, #1e3a8a);
            border: none;
            padding: 12px 24px;
            font-weight: 600;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            background: linear-gradient(95deg, #1e293b, #2563eb);
            color: white;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="processing-container">
    <div class="processing-card">
        <div class="cross-icon">
            <i class="fas fa-cross"></i>
        </div>
        <h2>Mobilization Church</h2>
        <p class="text-muted">Balilihan · Born Again Community</p>
        
        <div class="loading-spinner"></div>
        <p class="status-text" id="statusMessage">Authenticating your credentials...</p>
        
        <div id="errorContainer" style="display: none;">
            <div class="alert-box">
                <i class="fas fa-exclamation-triangle text-danger me-2"></i>
                <strong>Login Failed</strong><br>
                <span id="errorMessage">Invalid username or password. Please try again.</span>
            </div>
            <a href="login.html" class="btn-back"><i class="fas fa-arrow-left me-2"></i> Back to Login</a>
        </div>
        
        <div class="footer-note">
            <i class="fas fa-shield-alt"></i> Secured by Supabase
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ============================================================
    // SUPABASE CONFIGURATION
    // ============================================================
    // IMPORTANT: Replace these with your actual Supabase project credentials
    const SUPABASE_URL = 'https://YOUR_PROJECT.supabase.co';  // ← REPLACE WITH YOUR URL
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';                // ← REPLACE WITH YOUR ANON KEY
    
    // Initialize Supabase client
    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // ============================================================
    // ROLE-BASED REDIRECTION PATHS
    // ============================================================
    const roleRedirects = {
        'member': 'member/index.html',
        'music': 'music/index.html',
        'program': 'program/index.html',
        'pastor': 'pastor/index.html',
        'officer': 'officer/index.html'
    };
    
    // Get form data from URL parameters (POST data from login form)
    function getFormData() {
        // Since login.html uses POST method, we need to parse the URL query string
        // In a real scenario with POST, we'd need a backend. For this demo, we support both:
        // 1. URL parameters (GET fallback)
        // 2. Session storage (if login stored from previous)
        
        const urlParams = new URLSearchParams(window.location.search);
        let username = urlParams.get('username') || urlParams.get('email');
        let password = urlParams.get('password');
        
        // If no parameters in URL, check sessionStorage (from login simulation)
        if (!username && !password) {
            const storedData = sessionStorage.getItem('loginAttempt');
            if (storedData) {
                try {
                    const data = JSON.parse(storedData);
                    username = data.username;
                    password = data.password;
                    sessionStorage.removeItem('loginAttempt');
                } catch(e) {}
            }
        }
        
        return { username, password };
    }
    
    // Display error and stop loading
    function showError(message) {
        document.getElementById('statusMessage').style.display = 'none';
        document.querySelector('.loading-spinner').style.display = 'none';
        document.getElementById('errorContainer').style.display = 'block';
        document.getElementById('errorMessage').innerHTML = message;
    }
    
    // Redirect user based on role
    function redirectToRoleDashboard(role) {
        const redirectPath = roleRedirects[role.toLowerCase()];
        
        if (redirectPath) {
            // Store user info in session for dashboard use
            sessionStorage.setItem('userRole', role);
            sessionStorage.setItem('isLoggedIn', 'true');
            
            // Update status message before redirect
            document.getElementById('statusMessage').innerHTML = `Welcome! Redirecting to ${role} dashboard...`;
            
            setTimeout(() => {
                window.location.href = redirectPath;
            }, 800);
        } else {
            // Default fallback for unknown role
            showError(`Unknown role: ${role}. Please contact the church administrator.`);
        }
    }
    
    // Check if supabase is configured properly
    function isSupabaseConfigured() {
        if (SUPABASE_URL === 'https://YOUR_PROJECT.supabase.co' || SUPABASE_ANON_KEY === 'YOUR_ANON_KEY') {
            showError(`
                <strong>Supabase Configuration Required</strong><br><br>
                Please configure your Supabase connection:<br>
                1. Go to your Supabase project dashboard<br>
                2. Copy your Project URL and Anon Key<br>
                3. Update SUPABASE_URL and SUPABASE_ANON_KEY in the script<br><br>
                <small>For testing, use the demo mode below.</small>
            `);
            return false;
        }
        return true;
    }
    
    // DEMO MODE for testing without Supabase (shows role selection)
    // This allows testing of redirect functionality without actual DB
    function demoLogin(username, password) {
        console.log("⚠️ Running in DEMO MODE - No Supabase connection");
        
        // Demo credentials for testing roles
        const demoCredentials = {
            'member@church.com': { password: 'member123', role: 'member' },
            'music@church.com': { password: 'music123', role: 'music' },
            'program@church.com': { password: 'program123', role: 'program' },
            'pastor@church.com': { password: 'pastor123', role: 'pastor' },
            'officer@church.com': { password: 'officer123', role: 'officer' },
            'john_member': { password: 'member123', role: 'member' },
            'sarah_music': { password: 'music123', role: 'music' },
            'mike_program': { password: 'program123', role: 'program' }
        };
        
        const lowerUsername = username.toLowerCase();
        let userRole = null;
        
        // Check if credentials match demo accounts
        if (demoCredentials[lowerUsername] && demoCredentials[lowerUsername].password === password) {
            userRole = demoCredentials[lowerUsername].role;
        } 
        // Also check by email format
        else if (username.includes('@')) {
            const emailPrefix = username.split('@')[0].toLowerCase();
            if (emailPrefix.includes('member')) userRole = 'member';
            else if (emailPrefix.includes('music')) userRole = 'music';
            else if (emailPrefix.includes('program')) userRole = 'program';
            else if (emailPrefix.includes('pastor')) userRole = 'pastor';
            else if (emailPrefix.includes('officer')) userRole = 'officer';
            else userRole = 'member'; // default to member
            
            // Simple password check for demo
            if (password !== 'demo123' && password !== 'member123' && password !== 'church123') {
                showError('Demo Mode: Invalid password. Try: demo123, member123, music123, program123, pastor123, or officer123');
                return false;
            }
        }
        else {
            // Default demo fallback
            if (password === 'demo123' || password === 'church123') {
                userRole = 'member';
            } else {
                showError('Demo Mode Login Failed.<br><br>Demo credentials:<br>• member@church.com / member123<br>• music@church.com / music123<br>• program@church.com / program123<br>• pastor@church.com / pastor123<br>• officer@church.com / officer123');
                return false;
            }
        }
        
        if (userRole) {
            document.getElementById('statusMessage').innerHTML = `✓ Authentication successful! Welcome, ${username}. Redirecting to ${userRole} dashboard...`;
            setTimeout(() => {
                redirectToRoleDashboard(userRole);
            }, 500);
            return true;
        } else {
            showError('Invalid username or password. Please try again.<br><br>Demo Mode: Use any email with role prefix + password: demo123');
            return false;
        }
    }
    
    // Authenticate using Supabase (actual implementation)
    async function authenticateWithSupabase(username, password) {
        try {
            // Determine if username is email or plain username
            const isEmail = username.includes('@');
            
            let email = username;
            if (!isEmail) {
                // If username provided, we need to query users table to find email
                // This requires a 'users' table with username and role columns
                // Alternative: Use email + password from Supabase Auth
                
                // First, try to find user by username in 'church_users' table
                const { data: userData, error: userError } = await supabase
                    .from('church_users')
                    .select('email, role, username')
                    .eq('username', username)
                    .single();
                
                if (userError || !userData) {
                    throw new Error('Username not found');
                }
                
                email = userData.email;
                
                // Attempt sign in with email and password
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (authError) throw authError;
                
                // Return the role from database
                return { success: true, role: userData.role };
            } 
            else {
                // Direct email login
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (authError) throw authError;
                
                // Fetch user role from church_users table
                const { data: userData, error: userError } = await supabase
                    .from('church_users')
                    .select('role')
                    .eq('email', email)
                    .single();
                
                if (userError) {
                    // Default role if not found
                    return { success: true, role: 'member' };
                }
                
                return { success: true, role: userData.role };
            }
        } catch (error) {
            console.error('Supabase auth error:', error);
            return { success: false, error: error.message };
        }
    }
    
    // Main login processing function
    async function processLogin() {
        const { username, password } = getFormData();
        
        // Validate input
        if (!username || !password) {
            showError('No login credentials received. Please go back and fill in your username/email and password.');
            return;
        }
        
        // Check if Supabase is configured
        const isConfigured = (SUPABASE_URL !== 'https://YOUR_PROJECT.supabase.co' && SUPABASE_ANON_KEY !== 'YOUR_ANON_KEY');
        
        if (isConfigured) {
            // Real Supabase authentication
            try {
                document.getElementById('statusMessage').innerHTML = 'Connecting to Supabase...';
                
                const result = await authenticateWithSupabase(username, password);
                
                if (result.success) {
                    document.getElementById('statusMessage').innerHTML = `✓ Login successful! Redirecting to ${result.role} dashboard...`;
                    setTimeout(() => {
                        redirectToRoleDashboard(result.role);
                    }, 500);
                } else {
                    showError(`Authentication failed: ${result.error || 'Invalid credentials. Please check your username/email and password.'}`);
                }
            } catch (err) {
                showError(`Connection error: ${err.message}. Please check your Supabase configuration.`);
            }
        } else {
            // Fallback to demo mode for testing
            demoLogin(username, password);
        }
    }
    
    // Add a message that demo mode is active when no Supabase config
    function checkConfigAndWarn() {
        if (SUPABASE_URL === 'https://YOUR_PROJECT.supabase.co' || SUPABASE_ANON_KEY === 'YOUR_ANON_KEY') {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.innerHTML = '⚠️ Demo Mode Active (Supabase not configured)<br>Using local test credentials...';
            setTimeout(() => {
                statusDiv.innerHTML = 'Authenticating your credentials...';
            }, 1500);
        }
    }
    
    // Start login process when page loads
    window.addEventListener('DOMContentLoaded', () => {
        checkConfigAndWarn();
        // Small delay to show loading animation
        setTimeout(() => {
            processLogin();
        }, 500);
    });
    
    // Create a function to manually test with stored data (for debugging)
    window.testLogin = function(username, password, role) {
        const testRole = role || 'member';
        document.getElementById('statusMessage').innerHTML = `Test mode: Logging in as ${username} (${testRole})...`;
        setTimeout(() => {
            redirectToRoleDashboard(testRole);
        }, 500);
    };
</script>

<!-- Hidden instructions for developer -->
<script>
    (function() {
        console.log("%c🔐 Mobilization Church Login Processor", "color: #38bdf8; font-size: 16px; font-weight: bold;");
        console.log("%cSupabase Integration Active", "color: #22c55e;");
        console.log("%cRole Redirects: member, music, program, pastor, officer", "color: #f59e0b;");
        
        // Display current config status
        const isConfigured = (SUPABASE_URL !== 'https://YOUR_PROJECT.supabase.co');
        if (!isConfigured) {
            console.warn("%c⚠️ Supabase not configured. Using DEMO MODE with test credentials.", "color: #f97316; font-size: 12px;");
            console.log("%cDemo credentials: member@church.com / member123 | music@church.com / music123 | program@church.com / program123 | pastor@church.com / pastor123 | officer@church.com / officer123", "color: #94a3b8;");
        } else {
            console.log("%c✅ Supabase configured and ready.", "color: #22c55e;");
        }
    })();
</script>
</body>
</html>
