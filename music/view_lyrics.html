<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>View Song | Music Ministry | MCB Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            font-family: 'Inter', sans-serif;
            padding-bottom: 80px;
        }

        .view-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        /* Toolbar */
        .toolbar {
            background: white;
            border-radius: 28px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .tool-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #9d174d;
        }

        .btn-tool {
            background: linear-gradient(135deg, #9d174d, #db2777);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-tool:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(157,23,77,0.3);
        }

        .btn-back {
            background: #e2e8f0;
            color: #1e293b;
        }

        /* Option Toggle (Slide left/right) */
        .option-slider {
            display: flex;
            background: #f1f5f9;
            border-radius: 50px;
            padding: 4px;
            gap: 4px;
        }
        .option-btn {
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #475569;
            border: none;
        }
        .option-btn.active {
            background: #db2777;
            color: white;
            box-shadow: 0 2px 8px rgba(219,39,119,0.3);
        }

        /* Bond Paper Wrapper with horizontal scroll */
        .bond-paper-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .bond-paper {
            background: white;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 2rem;
            border-radius: 24px;
            max-width: 210mm;
            transition: all 0.2s;
        }

        /* Two column layout for lyrics/chords */
        .two-columns {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .col {
            flex: 1;
        }

        .song-header {
            border-bottom: 2px solid #fce7f3;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .song-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #9d174d;
        }
        .song-meta {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }

        .section-title {
            font-weight: 700;
            color: #9d174d;
            border-left: 4px solid #db2777;
            padding-left: 10px;
            margin-bottom: 0.8rem;
        }

        .lyrics-content, .chords-content {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
            background: #fefce8;
            padding: 1rem;
            border-radius: 16px;
            border: 1px solid #fde047;
            min-height: 300px;
            font-size: 12px;
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid #fce7f3;
            padding-top: 1rem;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .two-columns {
                flex-direction: column;
            }
            .bond-paper {
                padding: 1rem;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .tool-group {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

<div id="navbar-container"></div>

<div class="view-container">
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="tool-group">
            <span class="tool-label">Display Mode</span>
            <div class="option-slider" id="modeSlider">
                <button class="option-btn active" data-mode="lyrics-only">📖 Lyrics Only</button>
                <button class="option-btn" data-mode="lyrics-chords">🎵 Lyrics + Chords</button>
            </div>
        </div>
        <div class="tool-group">
            <button class="btn-tool" id="downloadImageBtn"><i class="fas fa-camera"></i> Download HD Image</button>
            <button class="btn-tool" id="downloadWordBtn"><i class="fas fa-file-word"></i> MS Word</button>
            <button class="btn-tool btn-back" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
    </div>

    <!-- Bond Paper (scrollable horizontally) -->
    <div class="bond-paper-wrapper">
        <div id="bondPaper" class="bond-paper">
            <div class="song-header">
                <div class="song-title" id="songTitle">Loading...</div>
                <div class="song-meta" id="songMeta">Key: — | Tempo: — | Lineup: —</div>
            </div>

            <!-- Two column container (will be manipulated by JS) -->
            <div id="contentArea" class="two-columns">
                <div class="col">
                    <div class="section-title"><i class="fas fa-align-left me-2"></i> Lyrics</div>
                    <div id="lyricsContent" class="lyrics-content">Loading...</div>
                </div>
                <div class="col" id="chordsColumn">
                    <div class="section-title"><i class="fas fa-guitar me-2"></i> Chords / Notes</div>
                    <div id="chordsContent" class="chords-content">Loading...</div>
                </div>
            </div>

            <div class="footer-note" id="footerNote">
                Song ID: — | Last updated: —
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="navbar_music.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
    const SUPABASE_URL = 'https://ypynnkupszfgqoxyirff.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweW5ua3Vwc3pmZ3FveHlpcmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODYwNjcsImV4cCI6MjA5Mjk2MjA2N30.aHfVKPLM9Yr2ck6A8MAfXHishoq0JaCbVnHNMF0Okqk';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUserId = null;
    let songData = null;
    let currentMode = 'lyrics-only'; // 'lyrics-only' or 'lyrics-chords'

    try {
        const session = localStorage.getItem('mcb_user_session') || sessionStorage.getItem('mcb_user_session');
        if (session) currentUserId = JSON.parse(session).id;
    } catch(e) {}

    function getParameterByName(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    async function loadSong() {
        const songId = getParameterByName('id');
        if (!songId) {
            document.getElementById('songTitle').innerText = 'Error: No song ID provided';
            return;
        }
        try {
            const { data, error } = await supabaseClient
                .from('songs')
                .select('*')
                .eq('song_id', songId)
                .single();
            if (error) throw error;
            if (!data) throw new Error('Song not found');
            songData = data;
            document.getElementById('songTitle').innerText = data.title || 'Untitled';
            document.getElementById('lyricsContent').innerHTML = escapeHtml(data.lyrics || '— No lyrics —').replace(/\n/g, '<br>');
            document.getElementById('chordsContent').innerHTML = escapeHtml(data.chords || '— No chords —').replace(/\n/g, '<br>');
            document.getElementById('songMeta').innerHTML = `Key: ${escapeHtml(data.key || '—')} | Tempo: ${escapeHtml(data.tempo || '—')} | Lineup: ${escapeHtml(data.lineup_id || '—')}`;
            document.getElementById('footerNote').innerHTML = `Song ID: ${escapeHtml(data.song_id)} | Last updated: ${data.updated_at ? new Date(data.updated_at).toLocaleString() : new Date(data.created_at).toLocaleString()}`;
            applyDisplayMode();
        } catch (err) {
            console.error(err);
            document.getElementById('songTitle').innerText = 'Error loading song';
            document.getElementById('lyricsContent').innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
        }
    }

    function applyDisplayMode() {
        const chordsColumn = document.getElementById('chordsColumn');
        if (currentMode === 'lyrics-only') {
            chordsColumn.style.display = 'none';
            document.getElementById('contentArea').classList.remove('two-columns');
            document.getElementById('contentArea').style.display = 'block';
        } else {
            chordsColumn.style.display = 'block';
            document.getElementById('contentArea').classList.add('two-columns');
            document.getElementById('contentArea').style.display = 'flex';
        }
    }

    function setMode(mode) {
        currentMode = mode;
        applyDisplayMode();
        // Update active button style
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-mode') === mode) btn.classList.add('active');
        });
    }

    async function downloadHDImage() {
        const element = document.getElementById('bondPaper');
        const originalOverflow = element.style.overflow;
        element.style.overflow = 'visible';
        const btn = document.getElementById('downloadImageBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
        btn.disabled = true;
        try {
            const canvas = await html2canvas(element, {
                scale: 3,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false
            });
            const link = document.createElement('a');
            link.download = `${songData?.title?.replace(/\s+/g, '_') || 'song'}_view.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        } catch (err) {
            console.error(err);
            alert('Error generating image. Please try again.');
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
            element.style.overflow = originalOverflow;
        }
    }

    function downloadWord() {
        // Clone the bond paper content and embed into a word document
        const content = document.getElementById('bondPaper').cloneNode(true);
        const styles = document.createElement('style');
        styles.textContent = `
            body { font-family: 'Inter', sans-serif; margin: 0.7in; }
            .toolbar, .btn-tool, .option-slider, #backBtn, #downloadImageBtn, #downloadWordBtn { display: none; }
            .bond-paper { max-width: 100%; padding: 0; box-shadow: none; }
            .two-columns { display: flex; gap: 1rem; }
            .col { flex: 1; }
            .lyrics-content, .chords-content { border: 1px solid #ccc; padding: 0.5rem; background: #fefce8; }
            .footer-note { margin-top: 1rem; font-size: 0.7rem; }
        `;
        content.insertBefore(styles, content.firstChild);
        const htmlContent = `<!DOCTYPE html>
        <html>
        <head>
            <meta charset="UTF-8">
            <title>${songData?.title || 'Song'} - Lyrics</title>
            <style>
                body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0.7in; }
                .two-columns { display: flex; gap: 1rem; }
                .col { flex: 1; }
                .song-header { text-align: center; margin-bottom: 1rem; }
                .song-title { font-size: 1.5rem; font-weight: bold; color: #9d174d; }
                .lyrics-content, .chords-content { white-space: pre-wrap; background: #fefce8; padding: 0.5rem; border: 1px solid #fde047; border-radius: 8px; }
                .section-title { font-weight: bold; margin-bottom: 0.5rem; color: #9d174d; }
                .footer-note { text-align: center; margin-top: 1rem; font-size: 0.7rem; color: #6c757d; }
            </style>
        </head>
        <body>${content.innerHTML}</body>
        </html>`;
        const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${songData?.title?.replace(/\s+/g, '_') || 'song'}_view.doc`;
        link.click();
        URL.revokeObjectURL(url);
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // Event listeners
    document.getElementById('downloadImageBtn').addEventListener('click', downloadHDImage);
    document.getElementById('downloadWordBtn').addEventListener('click', downloadWord);
    document.getElementById('backBtn').addEventListener('click', () => window.location.href = 'lyrics_music.html');
    document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => setMode(btn.getAttribute('data-mode')));
    });

    if (!currentUserId) {
        alert('Please login first.');
        window.location.href = '../login.html';
    } else {
        loadSong();
    }
</script>
</body>
</html>
