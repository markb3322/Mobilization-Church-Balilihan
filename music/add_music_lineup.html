<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Add Music Lineup | Music Ministry | MCB Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            font-family: 'Inter', system-ui, sans-serif;
            padding-bottom: 80px;
        }
        
        .lineup-container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 20px;
        }
        
        .page-header {
            background: white;
            border-radius: 24px;
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        
        .page-header::before {
            content: '♪ ♫ ♪';
            position: absolute;
            bottom: 5px;
            right: 20px;
            font-size: 3rem;
            opacity: 0.1;
            color: #9d174d;
            font-family: monospace;
        }
        
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #9d174d, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.25rem;
        }
        
        .page-header .subtitle {
            color: #64748b;
            font-size: 0.85rem;
        }
        
        .form-card {
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .form-header {
            background: linear-gradient(135deg, #9d174d, #db2777);
            padding: 1rem 1.8rem;
            color: white;
        }
        
        .form-header h3 {
            font-weight: 700;
            margin: 0;
            font-size: 1.3rem;
        }
        
        .form-body {
            padding: 1.8rem;
        }
        
        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        
        .music-section {
            background: #fdf2f8;
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            border-left: 5px solid #db2777;
        }
        
        .section-title {
            font-weight: 700;
            font-size: 1rem;
            color: #9d174d;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-label {
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #475569;
            margin-bottom: 0.3rem;
        }
        
        .form-control, .form-select {
            border-radius: 12px;
            padding: 0.7rem 1rem;
            border: 1.5px solid #e2e8f0;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: #db2777;
            box-shadow: 0 0 0 3px rgba(219,39,119,0.1);
            outline: none;
        }
        
        .dynamic-list {
            margin-top: 0.5rem;
        }
        
        .dynamic-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            background: white;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        
        .dynamic-item input {
            flex: 1;
            border: none;
            padding: 8px 0;
            font-size: 0.9rem;
            background: transparent;
        }
        
        .dynamic-item input:focus {
            outline: none;
        }
        
        .btn-remove {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #fee2e2;
            color: #dc2626;
        }
        
        .btn-remove:hover {
            background: #fecaca;
            transform: scale(1.05);
        }
        
        .add-btn-container {
            margin-top: 10px;
        }
        
        .btn-add-small {
            background: #f1f5f9;
            color: #9d174d;
            border: 1px dashed #cbd5e1;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-add-small:hover {
            background: #fdf2f8;
            border-color: #db2777;
        }
        
        .flow-section {
            background: linear-gradient(135deg, #fff5f9, #ffffff);
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #fce7f3;
        }
        
        .flow-item {
            margin-bottom: 1rem;
        }
        
        .flow-item label {
            font-weight: 600;
            font-size: 0.8rem;
            color: #9d174d;
            margin-bottom: 0.3rem;
            display: block;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #9d174d, #db2777);
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
            width: 100%;
            cursor: pointer;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(157,23,77,0.3);
        }
        
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .success-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 20px 40px;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
            font-size: 1rem;
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease, fadeOut 0.5s ease 2s forwards;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translate(-50%, -80%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        
        @keyframes fadeOut {
            from { opacity: 1; transform: translate(-50%, -50%); }
            to { opacity: 0; transform: translate(-50%, -60%); visibility: hidden; }
        }
        
        @media (max-width: 768px) {
            .two-columns { grid-template-columns: 1fr; gap: 1rem; }
            .form-body { padding: 1rem; }
            .music-section { padding: 1rem; }
            .page-header { padding: 1rem; }
            .page-header h1 { font-size: 1.4rem; }
            .success-toast { padding: 12px 24px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div id="navbar-container"></div>

<div class="lineup-container">
    <div class="page-header">
        <h1><i class="fas fa-music me-2"></i>🎵 Worship Lineup</h1>
        <p class="subtitle">Create and manage your Sunday worship setlist</p>
    </div>
    
    <div class="form-card">
        <div class="form-header">
            <h3><i class="fas fa-plus-circle"></i> Add New Music Lineup</h3>
        </div>
        
        <div class="form-body">
            <form id="lineupForm">
                <div class="two-columns">
                    <div>
                        <div class="music-section">
                            <div class="section-title">
                                <i class="fas fa-user"></i>
                                <span>Worship Leader & Date</span>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Worship Leader *</label>
                                <input type="text" id="worshipLeader" class="form-control" placeholder="Enter worship leader name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Service Date *</label>
                                <input type="date" id="serviceDate" class="form-control" required>
                            </div>
                        </div>
                        
                        <div class="music-section">
                            <div class="section-title">
                                <i class="fas fa-users"></i>
                                <span>Vocal Team</span>
                            </div>
                            <label class="form-label">Backup Singers</label>
                            <div id="backupSingersList" class="dynamic-list">
                                <div class="dynamic-item">
                                    <input type="text" class="backup-singer" placeholder="Singer name">
                                    <button type="button" class="btn-remove" data-action="removeBackup"><i class="fas fa-minus"></i></button>
                                </div>
                            </div>
                            <div class="add-btn-container">
                                <button type="button" class="btn-add-small" id="addBackupBtn">
                                    <i class="fas fa-plus me-1"></i> Add Backup Singer
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div>
                        <div class="music-section">
                            <div class="section-title">
                                <i class="fas fa-guitar"></i>
                                <span>Band Members</span>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Guitarist</label>
                                <input type="text" id="guitarist" class="form-control" placeholder="Guitarist name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Drummer</label>
                                <input type="text" id="drummer" class="form-control" placeholder="Drummer name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Bass Guitarist</label>
                                <input type="text" id="bassist" class="form-control" placeholder="Bass player name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Keyboardist</label>
                                <input type="text" id="keyboardist" class="form-control" placeholder="Keyboard player name">
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="flow-section">
                    <div class="section-title">
                        <i class="fas fa-list-ol"></i>
                        <span>Worship Flow</span>
                    </div>
                    
                    <div class="flow-item">
                        <label><i class="fas fa-music"></i> Opening Song</label>
                        <input type="text" id="openingSong" class="form-control" placeholder="Opening song title">
                    </div>
                    
                    <div class="flow-item">
                        <label><i class="fas fa-hand-peace"></i> Welcome Song</label>
                        <input type="text" id="welcomeSong" class="form-control" placeholder="Welcome song title">
                    </div>
                    
                    <div class="flow-item">
                        <label><i class="fas fa-heart"></i> Praise Songs</label>
                        <div id="praiseSongsList" class="dynamic-list">
                            <div class="dynamic-item">
                                <input type="text" class="praise-song" placeholder="Song title">
                                <button type="button" class="btn-remove" data-action="removePraise"><i class="fas fa-minus"></i></button>
                            </div>
                        </div>
                        <div class="add-btn-container">
                            <button type="button" class="btn-add-small" id="addPraiseBtn">
                                <i class="fas fa-plus me-1"></i> Add Praise Song
                            </button>
                        </div>
                    </div>
                    
                    <div class="flow-item">
                        <label><i class="fas fa-pray"></i> Worship Songs</label>
                        <div id="worshipSongsList" class="dynamic-list">
                            <div class="dynamic-item">
                                <input type="text" class="worship-song" placeholder="Song title">
                                <button type="button" class="btn-remove" data-action="removeWorship"><i class="fas fa-minus"></i></button>
                            </div>
                        </div>
                        <div class="add-btn-container">
                            <button type="button" class="btn-add-small" id="addWorshipBtn">
                                <i class="fas fa-plus me-1"></i> Add Worship Song
                            </button>
                        </div>
                    </div>
                    
                    <div class="flow-item">
                        <label><i class="fas fa-check-circle"></i> Closing Song</label>
                        <input type="text" id="closingSong" class="form-control" placeholder="Closing song title">
                    </div>
                </div>
                
                <div class="mt-4">
                    <button type="submit" id="submitBtn" class="btn-submit">
                        <i class="fas fa-save me-2"></i> Save Lineup
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="navbar_music.js"></script>

<script>
    (function() {
        const SUPABASE_URL = 'https://ypynnkupszfgqoxyirff.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweW5ua3Vwc3pmZ3FveHlpcmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODYwNjcsImV4cCI6MjA5Mjk2MjA2N30.aHfVKPLM9Yr2ck6A8MAfXHishoq0JaCbVnHNMF0Okqk';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUserId = null;
        
        try {
            const session = localStorage.getItem('mcb_user_session') || sessionStorage.getItem('mcb_user_session');
            if (session) {
                const user = JSON.parse(session);
                currentUserId = user.id;
            }
        } catch(e) {}
        
        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            const serviceDate = document.getElementById('serviceDate');
            if (serviceDate) serviceDate.value = today;
        }
        setDefaultDate();
        
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: ${type === 'error' ? 'linear-gradient(135deg, #ef4444, #dc2626)' : 'linear-gradient(135deg, #3b82f6, #2563eb)'};
                color: white;
                padding: 12px 24px;
                border-radius: 50px;
                font-size: 0.85rem;
                font-weight: 500;
                z-index: 9999;
                max-width: 90%;
                text-align: center;
            `;
            toast.innerHTML = `<i class="fas fa-info-circle me-2"></i>${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function showSuccessAndReset() {
            const toast = document.createElement('div');
            toast.className = 'success-toast';
            toast.innerHTML = '<i class="fas fa-check-circle"></i> Lineup Saved Successfully! 🎵';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                document.getElementById('lineupForm').reset();
                setDefaultDate();
                
                document.getElementById('backupSingersList').innerHTML = `
                    <div class="dynamic-item">
                        <input type="text" class="backup-singer" placeholder="Singer name">
                        <button type="button" class="btn-remove" data-action="removeBackup"><i class="fas fa-minus"></i></button>
                    </div>
                `;
                document.getElementById('praiseSongsList').innerHTML = `
                    <div class="dynamic-item">
                        <input type="text" class="praise-song" placeholder="Song title">
                        <button type="button" class="btn-remove" data-action="removePraise"><i class="fas fa-minus"></i></button>
                    </div>
                `;
                document.getElementById('worshipSongsList').innerHTML = `
                    <div class="dynamic-item">
                        <input type="text" class="worship-song" placeholder="Song title">
                        <button type="button" class="btn-remove" data-action="removeWorship"><i class="fas fa-minus"></i></button>
                    </div>
                `;
                showToast('Ready to add another lineup!', 'success');
            }, 2500);
        }
        
        function generateLineupId() {
            const year = new Date().getFullYear();
            const random = Math.floor(Math.random() * 10000).toString().padStart(5, '0');
            return `LINEUP-${year}-${random}`;
        }
        
        function getDynamicValues(className) {
            const inputs = document.querySelectorAll(`.${className}`);
            return Array.from(inputs).map(input => input.value.trim()).filter(v => v !== '');
        }
        
        // Dynamic list functions using event delegation
        function setupDynamicListeners() {
            document.addEventListener('click', function(e) {
                const btn = e.target.closest('.btn-remove');
                if (!btn) return;
                
                const action = btn.getAttribute('data-action');
                const item = btn.closest('.dynamic-item');
                const container = item.parentNode;
                
                if (container.children.length > 1) {
                    item.remove();
                } else {
                    showToast('At least one item is required', 'warning');
                }
            });
            
            document.getElementById('addBackupBtn')?.addEventListener('click', function() {
                const container = document.getElementById('backupSingersList');
                const div = document.createElement('div');
                div.className = 'dynamic-item';
                div.innerHTML = `
                    <input type="text" class="backup-singer" placeholder="Singer name">
                    <button type="button" class="btn-remove" data-action="removeBackup"><i class="fas fa-minus"></i></button>
                `;
                container.appendChild(div);
            });
            
            document.getElementById('addPraiseBtn')?.addEventListener('click', function() {
                const container = document.getElementById('praiseSongsList');
                const div = document.createElement('div');
                div.className = 'dynamic-item';
                div.innerHTML = `
                    <input type="text" class="praise-song" placeholder="Song title">
                    <button type="button" class="btn-remove" data-action="removePraise"><i class="fas fa-minus"></i></button>
                `;
                container.appendChild(div);
            });
            
            document.getElementById('addWorshipBtn')?.addEventListener('click', function() {
                const container = document.getElementById('worshipSongsList');
                const div = document.createElement('div');
                div.className = 'dynamic-item';
                div.innerHTML = `
                    <input type="text" class="worship-song" placeholder="Song title">
                    <button type="button" class="btn-remove" data-action="removeWorship"><i class="fas fa-minus"></i></button>
                `;
                container.appendChild(div);
            });
        }
        
        async function saveLineup() {
            const worshipLeader = document.getElementById('worshipLeader').value.trim();
            const serviceDate = document.getElementById('serviceDate').value;
            const guitarist = document.getElementById('guitarist').value.trim();
            const drummer = document.getElementById('drummer').value.trim();
            const bassist = document.getElementById('bassist').value.trim();
            const keyboardist = document.getElementById('keyboardist').value.trim();
            const openingSong = document.getElementById('openingSong').value.trim();
            const welcomeSong = document.getElementById('welcomeSong').value.trim();
            const closingSong = document.getElementById('closingSong').value.trim();
            
            const backupSingers = getDynamicValues('backup-singer');
            const praiseSongs = getDynamicValues('praise-song');
            const worshipSongs = getDynamicValues('worship-song');
            
            if (!worshipLeader) {
                showToast('Please enter worship leader name', 'error');
                return false;
            }
            
            if (!serviceDate) {
                showToast('Please select service date', 'error');
                return false;
            }
            
            if (backupSingers.length === 0) {
                showToast('Please add at least one backup singer', 'error');
                return false;
            }
            
            if (praiseSongs.length === 0) {
                showToast('Please add at least one praise song', 'error');
                return false;
            }
            
            if (worshipSongs.length === 0) {
                showToast('Please add at least one worship song', 'error');
                return false;
            }
            
            const lineupId = generateLineupId();
            
            const lineupData = {
                lineup_id: lineupId,
                user_id: currentUserId,
                worship_leader: worshipLeader,
                service_date: serviceDate,
                backup_singers: backupSingers,
                guitarist: guitarist || null,
                drummer: drummer || null,
                bassist: bassist || null,
                keyboardist: keyboardist || null,
                opening_song: openingSong || null,
                welcome_song: welcomeSong || null,
                praise_songs: praiseSongs,
                worship_songs: worshipSongs,
                closing_song: closingSong || null,
                created_at: new Date().toISOString()
            };
            
            try {
                const { error } = await supabaseClient.from('music_lineups').insert([lineupData]);
                if (error) {
                    if (error.code === '42P01') {
                        showToast('Table not found. Please create music_lineups table in Supabase.', 'error');
                    } else {
                        showToast('Error: ' + error.message, 'error');
                    }
                    return false;
                }
                return true;
            } catch (err) {
                console.error('Save error:', err);
                showToast('Error: ' + (err.message || 'Unknown error'), 'error');
                return false;
            }
        }
        
        document.getElementById('lineupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Saving...';
            
            const success = await saveLineup();
            
            if (success) {
                showSuccessAndReset();
            }
            
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        });
        
        setupDynamicListeners();
        
        if (!currentUserId) {
            showToast('Please login first to add music lineup', 'warning');
            setTimeout(() => {
                window.location.href = '../login.html';
            }, 3000);
        }
    })();
</script>

</body>
</html>
