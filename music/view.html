<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Member Profile | Music Ministry | MCB Portal</title>
    <!-- Bootstrap 5 + Icons + Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #fbcfe8 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            padding-bottom: 80px;
            min-height: 100vh;
        }
        
        /* Music-themed Container */
        .music-profile-container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 20px;
        }
        
        /* Music-themed Card */
        .music-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 5px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }
        
        .music-card::before {
            content: '♪ ♫ ♪';
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 5rem;
            opacity: 0.05;
            color: #9d174d;
            font-family: monospace;
            pointer-events: none;
            z-index: 0;
        }
        
        .music-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }
        
        /* Cover Photo */
        .music-cover {
            position: relative;
            height: 300px;
            background: linear-gradient(135deg, #9d174d, #be185d, #db2777);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }
        
        .music-cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #9d174d, #be185d, #db2777);
            color: rgba(255,255,255,0.3);
            font-size: 4rem;
        }
        
        /* Avatar */
        .music-avatar-wrapper {
            position: relative;
            padding: 0 28px;
        }
        
        .music-avatar {
            position: relative;
            margin-top: -75px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid white;
            background: white;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }
        
        .music-avatar:hover {
            transform: scale(1.02);
        }
        
        /* Name Section */
        .music-name-section {
            padding: 16px 28px 20px 28px;
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        
        .member-fullname {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #9d174d, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        
        .member-nickname {
            font-size: 1rem;
            font-weight: 500;
            color: #94a3b8;
            margin-left: 8px;
        }
        
        .role-badge-music {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, #9d174d, #db2777);
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            gap: 8px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(157,23,77,0.3);
        }
        
        .joined-badge-music {
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.75rem;
            border-radius: 40px;
            padding: 5px 14px;
            font-weight: 500;
        }
        
        /* Info Section */
        .music-info-section {
            padding: 24px 28px;
        }
        
        .section-title-music {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
            color: #9d174d;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title-music i {
            background: linear-gradient(135deg, #9d174d, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.3rem;
        }
        
        .music-info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem 1.8rem;
        }
        
        .music-info-item {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            transition: all 0.2s;
        }
        
        .music-info-item:hover {
            background: #fdf2f8;
            padding-left: 8px;
            border-radius: 12px;
        }
        
        .music-info-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #fdf2f8, #fce7f3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #db2777;
            font-size: 1.1rem;
        }
        
        .music-info-text {
            flex: 1;
        }
        
        .music-info-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        
        .music-info-value {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.95rem;
            word-break: break-word;
        }
        
        /* Action Buttons */
        .action-buttons-music {
            padding: 16px 28px 28px 28px;
            border-top: 1px solid rgba(0,0,0,0.08);
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .btn-music-secondary {
            background: #f1f5f9;
            color: #475569;
            border-radius: 40px;
            font-weight: 600;
            padding: 10px 28px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        
        .btn-music-secondary:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
            color: #9d174d;
        }
        
        /* Loading State */
        .loading-music {
            background: white;
            border-radius: 28px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        .spinner-music {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #9d174d, #db2777);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: pulse 1.2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1); opacity: 1; }
        }
        
        /* Error State */
        .error-music-card {
            background: white;
            border-radius: 28px;
            padding: 2.5rem;
            text-align: center;
        }
        
        /* Back Navigation */
        .back-nav-music {
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
        
        .back-btn-music {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 20px;
            border-radius: 40px;
            text-decoration: none;
            color: #9d174d;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
        }
        
        .back-btn-music:hover {
            background: #fdf2f8;
            transform: translateY(-2px);
            color: #be185d;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .music-profile-container {
                padding: 0 16px;
                margin: 1rem auto;
            }
            
            .music-cover {
                height: 180px;
            }
            
            .music-avatar {
                width: 100px;
                height: 100px;
                margin-top: -50px;
            }
            
            .music-avatar-wrapper {
                padding: 0 20px;
            }
            
            .member-fullname {
                font-size: 1.5rem;
            }
            
            .music-info-grid {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }
            
            .action-buttons-music {
                justify-content: center;
            }
            
            .member-nickname {
                display: block;
                margin-left: 0;
                margin-top: 4px;
            }
            
            .back-btn-music {
                padding: 6px 16px;
                font-size: 0.85rem;
            }
        }
        
        @media (max-width: 480px) {
            .music-avatar {
                width: 80px;
                height: 80px;
                margin-top: -40px;
            }
            
            .member-fullname {
                font-size: 1.2rem;
            }
            
            .music-info-value {
                font-size: 0.85rem;
            }
            
            .music-name-section {
                padding: 12px 20px 16px 20px;
            }
            
            .music-info-section {
                padding: 20px;
            }
            
            .action-buttons-music {
                padding: 16px 20px 24px 20px;
            }
        }
    </style>
</head>
<body>

<div class="music-profile-container">
    <!-- Back Navigation -->
    <div class="back-nav-music">
        <a href="javascript:history.back()" class="back-btn-music">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>
    
    <!-- Profile Content -->
    <div id="profileRoot"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="navbar_music.js"></script>

<script>
    const SUPABASE_URL = 'https://ypynnkupszfgqoxyirff.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweW5ua3Vwc3pmZ3FveHlpcmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODYwNjcsImV4cCI6MjA5Mjk2MjA2N30.aHfVKPLM9Yr2ck6A8MAfXHishoq0JaCbVnHNMF0Okqk';
    
    let supabaseClient = null;
    
    if (typeof supabase !== 'undefined') {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log("✅ Supabase client initialized");
    }
    
    function getUserIdFromUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id');
    }
    
    function formatDateMusic(dateStr) {
        if (!dateStr) return null;
        try {
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;
            return date.toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
        } catch(e) { return dateStr; }
    }
    
    function formatRelativeDate(timestamp) {
        if (!timestamp) return 'Unknown';
        try {
            const d = new Date(timestamp);
            return d.toLocaleDateString('en-PH', { year: 'numeric', month: 'short', day: 'numeric' });
        } catch(e) { return '—'; }
    }
    
    function getRoleDetails(role) {
        const roleConfig = {
            'member': { label: 'Member', icon: 'fas fa-user-friends', gradient: 'linear-gradient(135deg, #3b82f6, #2563eb)' },
            'music': { label: 'Music Ministry', icon: 'fas fa-music', gradient: 'linear-gradient(135deg, #a855f7, #7c3aed)' },
            'program': { label: 'Program Ministry', icon: 'fas fa-calendar-alt', gradient: 'linear-gradient(135deg, #f59e0b, #d97706)' },
            'pastor': { label: 'Pastor', icon: 'fas fa-church', gradient: 'linear-gradient(135deg, #10b981, #059669)' },
            'officer': { label: 'Church Officer', icon: 'fas fa-gavel', gradient: 'linear-gradient(135deg, #ef4444, #dc2626)' }
        };
        return roleConfig[role] || { label: 'Member', icon: 'fas fa-user', gradient: 'linear-gradient(135deg, #667eea, #764ba2)' };
    }
    
    function getInitialAvatar(name, size = 150) {
        if (!name) name = 'Member';
        const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(initials || 'U')}&background=db2777&color=fff&size=${size}&bold=true&font-size=60&rounded=true`;
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function calculateAge(birthday) {
        if (!birthday) return null;
        const birthDate = new Date(birthday);
        if (isNaN(birthDate.getTime())) return null;
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const monthDiff = today.getMonth() - birthDate.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) age--;
        return age;
    }
    
    function renderMusicProfile(user) {
        if (!user) return;
        
        let coverStyle = '';
        let coverInnerHtml = '';
        if (user.background_image && user.background_image.trim() !== '' && user.background_image !== 'null') {
            coverStyle = `background-image: url('${user.background_image}'); background-size: cover; background-position: center 20%;`;
            coverInnerHtml = '';
        } else {
            coverStyle = 'background: linear-gradient(135deg, #9d174d, #be185d, #db2777);';
            coverInnerHtml = `<div class="music-cover-placeholder"><i class="fas fa-music"></i></div>`;
        }
        
        let profileImgSrc = getInitialAvatar(user.full_name, 150);
        if (user.profile_image && user.profile_image.trim() !== '' && user.profile_image !== 'null') {
            profileImgSrc = user.profile_image;
        }
        
        const fullName = user.full_name || 'Church Member';
        const nickname = user.nickname ? `(${user.nickname})` : '';
        const roleDetail = getRoleDetails(user.role);
        const joinedDateRaw = user.created_at ? formatRelativeDate(user.created_at) : 'Recently';
        const emailValue = user.email || 'Not provided';
        const addressValue = user.address || 'Not set';
        const birthdayValue = user.birthday ? formatDateMusic(user.birthday) : 'Not set';
        const birthPlaceValue = user.birth_place || 'Not set';
        const usernameValue = user.username || '—';
        
        let ageValue = user.age ? `${user.age} years old` : '—';
        if (!user.age && user.birthday) {
            const computedAge = calculateAge(user.birthday);
            if (computedAge !== null && computedAge > 0) ageValue = `${computedAge} years old`;
        }
        
        const memberSince = user.created_at ? formatDateMusic(user.created_at) : '—';
        const lastUpdated = user.updated_at ? formatDateMusic(user.updated_at) : '—';
        
        const html = `
            <div class="music-card">
                <div class="music-cover" style="${coverStyle}">
                    ${coverInnerHtml}
                </div>
                
                <div class="music-avatar-wrapper">
                    <img class="music-avatar" src="${profileImgSrc}" alt="Profile" 
                         onerror="this.onerror=null; this.src='${getInitialAvatar(user.full_name, 150)}'">
                </div>
                
                <div class="music-name-section">
                    <div>
                        <span class="member-fullname">${escapeHtml(fullName)}</span>
                        ${nickname ? `<span class="member-nickname">${escapeHtml(nickname)}</span>` : ''}
                        <div class="mt-2 d-flex flex-wrap gap-2 align-items-center">
                            <span class="role-badge-music" style="background: ${roleDetail.gradient}">
                                <i class="${roleDetail.icon}"></i> ${escapeHtml(roleDetail.label)}
                            </span>
                            <span class="joined-badge-music">
                                <i class="far fa-calendar-alt me-1"></i> Joined ${joinedDateRaw}
                            </span>
                        </div>
                    </div>
                </div>
                
                <div class="music-info-section">
                    <div class="section-title-music">
                        <i class="fas fa-address-card"></i> 
                        <span>Personal Information</span>
                    </div>
                    <div class="music-info-grid">
                        <div class="music-info-item">
                            <div class="music-info-icon"><i class="fas fa-envelope"></i></div>
                            <div class="music-info-text">
                                <div class="music-info-label">Email</div>
                                <div class="music-info-value">${escapeHtml(emailValue)}</div>
                            </div>
                        </div>
                        <div class="music-info-item">
                            <div class="music-info-icon"><i class="fas fa-map-pin"></i></div>
                            <div class="music-info-text">
                                <div class="music-info-label">Address</div>
                                <div class="music-info-value">${escapeHtml(addressValue)}</div>
                            </div>
                        </div>
                        <div class="music-info-item">
                            <div class="music-info-icon"><i class="fas fa-cake-candles"></i></div>
                            <div class="music-info-text">
                                <div class="music-info-label">Birthday</div>
                                <div class="music-info-value">${escapeHtml(birthdayValue)}</div>
                            </div>
                        </div>
                        <div class="music-info-item">
                            <div class="music-info-icon"><i class="fas fa-globe"></i></div>
                            <div class="music-info-text">
                                <div class="music-info-label">Birth Place</div>
                                <div class="music-info-value">${escapeHtml(birthPlaceValue)}</div>
                            </div>
                        </div>
                        <div class="music-info-item">
                            <div class="music-info-icon"><i class="fas fa-user-circle"></i></div>
                            <div class="music-info-text">
                                <div class="music-info-label">Username</div>
                                <div class="music-info-value">@${escapeHtml(usernameValue)}</div>
                            </div>
                        </div>
                        <div class="music-info-item">
                            <div class="music-info-icon"><i class="fas fa-calendar-week"></i></div>
                            <div class="music-info-text">
                                <div class="music-info-label">Age</div>
                                <div class="music-info-value">${escapeHtml(ageValue)}</div>
                            </div>
                        </div>
                        <div class="music-info-item">
                            <div class="music-info-icon"><i class="fas fa-id-card"></i></div>
                            <div class="music-info-text">
                                <div class="music-info-label">Member ID</div>
                                <div class="music-info-value">#${user.id}</div>
                            </div>
                        </div>
                        <div class="music-info-item">
                            <div class="music-info-icon"><i class="fas fa-clock"></i></div>
                            <div class="music-info-text">
                                <div class="music-info-label">Member Since</div>
                                <div class="music-info-value">${escapeHtml(memberSince)}</div>
                            </div>
                        </div>
                        ${lastUpdated !== '—' ? `
                        <div class="music-info-item">
                            <div class="music-info-icon"><i class="fas fa-edit"></i></div>
                            <div class="music-info-text">
                                <div class="music-info-label">Last Updated</div>
                                <div class="music-info-value">${escapeHtml(lastUpdated)}</div>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                </div>
                
                <div class="action-buttons-music">
                    <a href="javascript:history.back()" class="btn-music-secondary">
                        <i class="fas fa-arrow-left"></i> Back to Dashboard
                    </a>
                </div>
            </div>
        `;
        
        const rootDiv = document.getElementById('profileRoot');
        if (rootDiv) rootDiv.innerHTML = html;
    }
    
    function showLoadingState() {
        const root = document.getElementById('profileRoot');
        if (root) {
            root.innerHTML = `
                <div class="loading-music">
                    <div class="spinner-music"></div>
                    <p class="text-muted"><i class="fas fa-music me-2"></i> Loading member profile...</p>
                </div>
            `;
        }
    }
    
    function showErrorMessage(message) {
        const root = document.getElementById('profileRoot');
        if (root) {
            root.innerHTML = `
                <div class="error-music-card">
                    <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                    <h5 class="fw-bold">Unable to Load Profile</h5>
                    <p class="text-muted">${escapeHtml(message)}</p>
                    <a href="javascript:history.back()" class="btn-music-secondary mt-3">
                        <i class="fas fa-arrow-left me-1"></i> Go Back
                    </a>
                </div>
            `;
        }
    }
    
    async function fetchProfile(userId) {
        if (!userId) {
            showErrorMessage('Missing member ID. Please go back and select a valid member.');
            return;
        }
        
        if (!supabaseClient) {
            showErrorMessage('Supabase client error. Please check your connection.');
            return;
        }
        
        showLoadingState();
        
        try {
            const { data, error } = await supabaseClient
                .from('church_users')
                .select('*')
                .eq('id', userId)
                .single();
                
            if (error) {
                console.error('Supabase error:', error);
                if (error.code === 'PGRST116') {
                    showErrorMessage(`No member found with ID ${userId}. The profile may have been deleted.`);
                } else {
                    showErrorMessage(`Failed to load profile: ${error.message}`);
                }
                return;
            }
            
            if (!data) {
                showErrorMessage('Member data not found.');
                return;
            }
            
            renderMusicProfile(data);
        } catch (err) {
            console.error('Fetch error:', err);
            showErrorMessage(`Network error: ${err.message || 'Please check your connection'}`);
        }
    }
    
    const memberId = getUserIdFromUrl();
    
    if (memberId) {
        fetchProfile(memberId);
    } else {
        showErrorMessage('No member ID provided. Please use ?id= parameter in the URL.');
    }
</script>

</body>
</html>
