<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Lyrics & Chords | Music Ministry | MCB Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            font-family: 'Inter', sans-serif;
            padding-bottom: 80px;
        }

        .song-viewer {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        /* Simple back button (optional, keep for navigation) */
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            background: white;
            padding: 6px 16px;
            border-radius: 40px;
            text-decoration: none;
            color: #9d174d;
            font-weight: 500;
            border: 1px solid #fce7f3;
            transition: 0.2s;
        }
        .back-link:hover {
            background: #fef2f8;
        }

        /* Bond Paper Container */
        .bond-paper-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .bond-paper {
            background: white;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 2rem;
            border-radius: 24px;
            max-width: 210mm;
        }

        /* Two column layout for lyrics/chords */
        .two-columns {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .col {
            flex: 1;
        }

        .song-header {
            border-bottom: 2px solid #fce7f3;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .song-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #9d174d;
        }
        .song-meta {
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 0.3rem;
        }

        .section-title {
            font-weight: 700;
            color: #9d174d;
            border-left: 4px solid #db2777;
            padding-left: 10px;
            margin-bottom: 0.8rem;
        }

        .lyrics-content, .chords-content {
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
            background: #fefce8;
            padding: 1rem;
            border-radius: 16px;
            border: 1px solid #fde047;
            min-height: 300px;
            font-size: 12px;
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid #fce7f3;
            padding-top: 1rem;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .two-columns {
                flex-direction: column;
            }
            .bond-paper {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

<div id="navbar-container"></div>

<div class="song-viewer">
    <!-- Simple back button (optional, can be removed if not needed) -->
    <a href="lyrics_music.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Library</a>

    <!-- Bond Paper (scrollable horizontally) -->
    <div class="bond-paper-wrapper">
        <div id="bondPaper" class="bond-paper">
            <div class="song-header">
                <div class="song-title" id="songTitle">Loading...</div>
                <div class="song-meta" id="songMeta">Key: — | Tempo: — | Lineup: —</div>
            </div>

            <div class="two-columns">
                <div class="col">
                    <div class="section-title"><i class="fas fa-align-left me-2"></i> Lyrics</div>
                    <div id="lyricsContent" class="lyrics-content">Loading...</div>
                </div>
                <div class="col">
                    <div class="section-title"><i class="fas fa-guitar me-2"></i> Chords / Notes</div>
                    <div id="chordsContent" class="chords-content">Loading...</div>
                </div>
            </div>

            <div class="footer-note" id="footerNote">
                Song ID: — | Last updated: —
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="navbar_music.js"></script>

<script>
    const SUPABASE_URL = 'https://ypynnkupszfgqoxyirff.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweW5ua3Vwc3pmZ3FveHlpcmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODYwNjcsImV4cCI6MjA5Mjk2MjA2N30.aHfVKPLM9Yr2ck6A8MAfXHishoq0JaCbVnHNMF0Okqk';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUserId = null;

    try {
        const session = localStorage.getItem('mcb_user_session') || sessionStorage.getItem('mcb_user_session');
        if (session) currentUserId = JSON.parse(session).id;
    } catch(e) {}

    function getParameterByName(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    async function loadSong() {
        const songId = getParameterByName('id');
        if (!songId) {
            document.getElementById('songTitle').innerText = 'Error: No song ID provided';
            return;
        }
        try {
            const { data, error } = await supabaseClient
                .from('songs')
                .select('*')
                .eq('song_id', songId)
                .single();
            if (error) throw error;
            if (!data) throw new Error('Song not found');
            document.getElementById('songTitle').innerText = data.title || 'Untitled';
            document.getElementById('lyricsContent').innerHTML = escapeHtml(data.lyrics || '— No lyrics —').replace(/\n/g, '<br>');
            document.getElementById('chordsContent').innerHTML = escapeHtml(data.chords || '— No chords —').replace(/\n/g, '<br>');
            document.getElementById('songMeta').innerHTML = `Key: ${escapeHtml(data.key || '—')} | Tempo: ${escapeHtml(data.tempo || '—')} | Lineup: ${escapeHtml(data.lineup_id || '—')}`;
            document.getElementById('footerNote').innerHTML = `Song ID: ${escapeHtml(data.song_id)} | Last updated: ${data.updated_at ? new Date(data.updated_at).toLocaleString() : new Date(data.created_at).toLocaleString()}`;
        } catch (err) {
            console.error(err);
            document.getElementById('songTitle').innerText = 'Error loading song';
            document.getElementById('lyricsContent').innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
        }
    }

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    if (!currentUserId) {
        alert('Please login first.');
        window.location.href = '../login.html';
    } else {
        loadSong();
    }
</script>
</body>
</html>
