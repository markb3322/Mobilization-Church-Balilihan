<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Edit Lyrics | Music Ministry | MCB Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            font-family: 'Inter', sans-serif;
            padding-bottom: 80px;
        }

        .lyrics-editor-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        /* Toolbar */
        .toolbar {
            background: white;
            border-radius: 28px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .tool-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #9d174d;
        }

        .tool-select, .tool-input, .tool-color {
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            font-size: 0.85rem;
            background: white;
        }

        .btn-tool, .btn-save, .btn-back {
            background: linear-gradient(135deg, #9d174d, #db2777);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-tool:hover, .btn-save:hover, .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(157,23,77,0.3);
        }

        /* Bond Paper Container */
        .bond-paper-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 2rem;
        }

        .bond-paper {
            background: white;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: all 0.3s;
            padding: 2rem;
            border-radius: 24px;
        }

        .bond-paper.a4 { max-width: 210mm; }
        .bond-paper.long { max-width: 8.5in; min-height: 13in; }
        .bond-paper.short { max-width: 8.5in; min-height: 11in; }

        /* Two columns for lyrics/chords */
        .two-columns {
            display: flex;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .column {
            flex: 1;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #9d174d;
            margin-bottom: 0.3rem;
            display: block;
        }
        .form-control {
            border-radius: 14px;
            border: 1.5px solid #e2e8f0;
            padding: 0.7rem 1rem;
            font-size: 0.9rem;
            width: 100%;
        }
        textarea.form-control {
            min-height: 350px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }

        .song-header {
            border-bottom: 2px solid #fce7f3;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        .song-title-display {
            font-size: 1.6rem;
            font-weight: 800;
            color: #9d174d;
        }
        .song-meta {
            color: #64748b;
            font-size: 0.8rem;
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid #fce7f3;
            padding-top: 1rem;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .two-columns {
                flex-direction: column;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .tool-group {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

<div id="navbar-container"></div>

<div class="lyrics-editor-container">
    <!-- Toolbar -->
    <div class="toolbar">
        <div class="tool-group">
            <span class="tool-label">Font Size</span>
            <input type="range" id="fontSizeSlider" min="8" max="20" value="12" style="width: 120px;">
            <span id="fontSizeValue">12px</span>
        </div>
        <div class="tool-group">
            <span class="tool-label">Font Color</span>
            <input type="color" id="fontColorPicker" value="#000000">
        </div>
        <div class="tool-group">
            <span class="tool-label">Paper Size</span>
            <select id="paperSizeSelect" class="tool-select">
                <option value="a4">A4</option>
                <option value="short">Short (8.5x11)</option>
                <option value="long">Long (8.5x13)</option>
            </select>
        </div>
        <div class="tool-group">
            <button class="btn-back" id="backBtn"><i class="fas fa-arrow-left"></i> Back</button>
            <button class="btn-save" id="saveBtn"><i class="fas fa-save"></i> Save Lyrics</button>
        </div>
    </div>

    <!-- Bond Paper (horizontal scroll) -->
    <div class="bond-paper-wrapper">
        <div id="bondPaper" class="bond-paper a4">
            <!-- Song Info Header (auto-filled from DB) -->
            <div class="song-header">
                <div class="song-title-display" id="songTitleDisplay">Loading...</div>
                <div class="song-meta">
                    <span id="songMetaLine">Key: — | Tempo: — | Lineup: —</span>
                </div>
            </div>

            <!-- Two‑column lyrics / chords -->
            <div class="two-columns">
                <div class="column">
                    <div class="form-group">
                        <label><i class="fas fa-align-left"></i> Lyrics</label>
                        <textarea id="lyricsTextarea" class="form-control" placeholder="Enter lyrics line by line..."></textarea>
                    </div>
                </div>
                <div class="column">
                    <div class="form-group">
                        <label><i class="fas fa-guitar"></i> Chords / Notes</label>
                        <textarea id="chordsTextarea" class="form-control" placeholder="Enter chords or musical notes..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Optional extra fields (key, tempo) - inline -->
            <div class="row mt-3">
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Key</label>
                        <input type="text" id="keyInput" class="form-control" placeholder="e.g., G">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Tempo</label>
                        <input type="text" id="tempoInput" class="form-control" placeholder="e.g., 72 BPM">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label>Lineup ID (optional)</label>
                        <input type="text" id="lineupIdInput" class="form-control" placeholder="Associated lineup ID">
                    </div>
                </div>
            </div>

            <div class="footer-note" id="footerNote">
                Song ID: — | Last updated: —
            </div>
        </div>
    </div>
    <div id="messageArea"></div>
</div>

<!-- Small toast for save feedback -->
<div id="toastMsg" style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 12px 24px; border-radius: 60px; display: none; z-index: 9999; font-weight: 600;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="navbar_music.js"></script>

<script>
    const SUPABASE_URL = 'https://ypynnkupszfgqoxyirff.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweW5ua3Vwc3pmZ3FveHlpcmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODYwNjcsImV4cCI6MjA5Mjk2MjA2N30.aHfVKPLM9Yr2ck6A8MAfXHishoq0JaCbVnHNMF0Okqk';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUserId = null;
    let currentSongId = null;

    try {
        const session = localStorage.getItem('mcb_user_session') || sessionStorage.getItem('mcb_user_session');
        if (session) currentUserId = JSON.parse(session).id;
    } catch(e) {}

    function getParameterByName(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }

    async function loadSong() {
        const songId = getParameterByName('id');
        if (!songId) {
            document.getElementById('songTitleDisplay').innerText = 'Error: No song ID provided';
            return;
        }
        currentSongId = songId;
        try {
            const { data, error } = await supabaseClient
                .from('songs')
                .select('*')
                .eq('song_id', songId)
                .single();
            if (error) throw error;
            if (!data) throw new Error('Song not found');
            document.getElementById('songTitleDisplay').innerText = data.title || 'Untitled';
            document.getElementById('lyricsTextarea').value = data.lyrics || '';
            document.getElementById('chordsTextarea').value = data.chords || '';
            document.getElementById('keyInput').value = data.key || '';
            document.getElementById('tempoInput').value = data.tempo || '';
            document.getElementById('lineupIdInput').value = data.lineup_id || '';
            document.getElementById('footerNote').innerHTML = `Song ID: ${escapeHtml(data.song_id)} | Last updated: ${data.updated_at ? new Date(data.updated_at).toLocaleString() : new Date(data.created_at).toLocaleString()}`;
            // Apply current styles to textareas (live)
            applyStylesToEditors();
        } catch (err) {
            console.error(err);
            document.getElementById('songTitleDisplay').innerText = 'Error loading song';
            showMessage('Error loading song: ' + err.message, true);
        }
    }

    function applyStylesToEditors() {
        const fontSize = document.getElementById('fontSizeSlider').value;
        const fontColor = document.getElementById('fontColorPicker').value;
        const style = `font-size: ${fontSize}px; color: ${fontColor}; font-family: 'Courier New', monospace;`;
        document.getElementById('lyricsTextarea').style.cssText = style + ' min-height: 350px;';
        document.getElementById('chordsTextarea').style.cssText = style + ' min-height: 350px;';
        document.getElementById('fontSizeValue').innerText = fontSize + 'px';
    }

    function updatePaperSize() {
        const paper = document.getElementById('bondPaper');
        const size = document.getElementById('paperSizeSelect').value;
        paper.classList.remove('a4', 'short', 'long');
        paper.classList.add(size);
    }

    function showMessage(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.style.background = isError ? '#dc2626' : '#10b981';
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    async function saveSong() {
        const title = document.getElementById('songTitleDisplay').innerText; // not editable, but fine
        const lyrics = document.getElementById('lyricsTextarea').value;
        const chords = document.getElementById('chordsTextarea').value;
        const key = document.getElementById('keyInput').value;
        const tempo = document.getElementById('tempoInput').value;
        const lineupId = document.getElementById('lineupIdInput').value || null;

        const updateData = {
            lyrics,
            chords,
            key: key || null,
            tempo: tempo || null,
            lineup_id: lineupId,
            updated_at: new Date().toISOString(),
            title: title   // keep original
        };

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
        try {
            const { error } = await supabaseClient
                .from('songs')
                .update(updateData)
                .eq('song_id', currentSongId)
                .eq('user_id', currentUserId);
            if (error) throw error;
            showMessage('Lyrics saved successfully!', false);
            // refresh footer date
            const { data: fresh } = await supabaseClient.from('songs').select('updated_at').eq('song_id', currentSongId).single();
            if (fresh && fresh.updated_at) {
                document.getElementById('footerNote').innerHTML = `Song ID: ${escapeHtml(currentSongId)} | Last updated: ${new Date(fresh.updated_at).toLocaleString()}`;
            }
        } catch (err) {
            console.error(err);
            showMessage('Error saving: ' + err.message, true);
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="fas fa-save"></i> Save Lyrics';
        }
    }

    // Event listeners
    document.getElementById('fontSizeSlider').addEventListener('input', applyStylesToEditors);
    document.getElementById('fontColorPicker').addEventListener('input', applyStylesToEditors);
    document.getElementById('paperSizeSelect').addEventListener('change', updatePaperSize);
    document.getElementById('saveBtn').addEventListener('click', saveSong);
    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'lyrics_music.html';
    });

    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // Initialization
    if (!currentUserId) {
        alert('Please login first.');
        window.location.href = '../login.html';
    } else {
        loadSong();
        applyStylesToEditors();
        updatePaperSize();
    }
</script>
</body>
</html>
