<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Logged Out | MCB Portal</title>

    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
              }
            },
            fontFamily: {
              'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
<body class="font-jakarta bg-slate-50">

    <!-- Navbar (same as other pages) -->
    <div id="navbar-container"></div>

    <main class="flex items-center justify-center min-h-[80vh] px-4">
        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8 sm:p-10 max-w-md w-full text-center">
            <!-- Success Checkmark -->
            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-check-circle text-green-600 text-4xl"></i>
            </div>

            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2">You've been logged out</h1>
            <p class="text-slate-500 mb-6">Thank you for using the MCB Portal. You have been securely signed out of your account.</p>

            <!-- Redirect message -->
            <p class="text-sm text-slate-400 mb-6 flex items-center justify-center gap-2">
                <span class="w-4 h-4 border-2 border-slate-300 border-t-blue-600 rounded-full animate-spin"></span>
                Redirecting to login in <span id="countdown">5</span> seconds...
            </p>

            <!-- Manual login button -->
            <a href="../login.html" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-8 rounded-full transition-colors shadow-md shadow-blue-200">
                <i class="fas fa-sign-in-alt"></i> Go to Login Now
            </a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="navbar_program.js"></script>

    <script>
        // Clear all user sessions on page load
        (function() {
            // Remove all possible session keys
            localStorage.removeItem('mcb_user_session');
            sessionStorage.removeItem('mcb_user_session');
            localStorage.removeItem('program_current_user');
            console.log("✅ User session cleared successfully");

            // Countdown redirect
            let seconds = 5;
            const countdownEl = document.getElementById('countdown');

            const interval = setInterval(() => {
                seconds--;
                if (countdownEl) countdownEl.textContent = seconds;

                if (seconds <= 0) {
                    clearInterval(interval);
                    window.location.href = '../login.html';
                }
            }, 1000);
        })();
    </script>
</body>
</html>
