<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Program Records | MCB Portal</title>
    
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                200: '#bae6fd',
                300: '#7dd3fc',
                400: '#38bdf8',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                800: '#075985',
                900: '#0c4a6e',
              }
            },
            fontFamily: {
              'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc; /* light background */
        }
        .card-glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(203, 213, 225, 0.6);
            border-radius: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
        .stat-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .table-row-hover:hover {
            background-color: rgba(59, 130, 246, 0.03);
        }
        .btn-action {
            @apply inline-flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 hover:scale-105 focus:outline-none;
        }
        .modal-overlay {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
        }
    </style>
</head>
<body class="font-jakarta text-slate-700">

    <!-- Navbar will be injected by navbar_program.js -->
    <div id="navbar-container"></div>

    <!-- Main container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-2 flex items-center justify-center gap-3">
                <i class="fas fa-database text-blue-600"></i> 📋 Program Records
            </h1>
            <p class="text-slate-500 text-sm md:text-base">Manage and track all Sunday service programs</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="stat-card card-glass p-5 text-center">
                <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-calendar-alt text-blue-600 text-xl"></i>
                </div>
                <div class="text-3xl font-extrabold text-slate-800" id="totalPrograms">0</div>
                <div class="text-xs uppercase tracking-widest text-slate-500 mt-1">Total Programs</div>
            </div>
            <div class="stat-card card-glass p-5 text-center">
                <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-church text-emerald-600 text-xl"></i>
                </div>
                <div class="text-3xl font-extrabold text-slate-800" id="totalSundays">0</div>
                <div class="text-xs uppercase tracking-widest text-slate-500 mt-1">Sunday Services</div>
            </div>
            <div class="stat-card card-glass p-5 text-center">
                <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-user-check text-amber-600 text-xl"></i>
                </div>
                <div class="text-3xl font-extrabold text-slate-800" id="myPrograms">0</div>
                <div class="text-xs uppercase tracking-widest text-slate-500 mt-1">My Programs</div>
            </div>
        </div>

        <!-- Search & Filter Bar (shown when logged in) -->
        <div id="searchBar" class="card-glass p-4 mb-6 hidden flex-col sm:flex-row gap-4 items-stretch sm:items-center justify-between">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search by MC name or pastor..." class="w-full bg-white border border-slate-200 rounded-xl py-2.5 pl-11 pr-4 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-400 transition-all">
            </div>
            <div class="flex gap-3 flex-wrap">
                <select id="filterDate" class="bg-white border border-slate-200 rounded-xl py-2.5 px-3 text-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50">
                    <option value="all">All Dates</option>
                    <option value="today">Today</option>
                    <option value="week">This Week</option>
                    <option value="month">This Month</option>
                </select>
                <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-medium transition-colors flex items-center gap-2 shadow-sm">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <a href="add_program.html" class="bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-700 hover:to-cyan-600 text-white px-4 py-2.5 rounded-xl font-medium transition-all flex items-center gap-2 no-underline shadow-sm">
                    <i class="fas fa-plus-circle"></i> New Program
                </a>
            </div>
        </div>

        <!-- Desktop Table View (wrapped in card) -->
        <div class="card-glass overflow-hidden mb-8">
            <div id="tableContent" class="overflow-x-auto">
                <!-- Loading state will be shown initially -->
            </div>
        </div>

        <!-- Mobile Card View (outside table wrapper, shown only on small screens) -->
        <div id="mobileCardView" class="grid grid-cols-1 sm:grid-cols-2 lg:hidden gap-4"></div>
    </main>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 z-[1050] hidden items-center justify-center p-4 modal-overlay" onclick="if(event.target===this) closeDeleteModal()">
        <div class="bg-white border border-slate-200 rounded-3xl p-6 max-w-md w-full shadow-2xl animate-fade-in">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center">
                    <i class="fas fa-trash-alt text-red-600"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800">Delete Program</h3>
            </div>
            <p class="text-slate-600 mb-2">Are you sure you want to delete this program?</p>
            <p class="text-sm text-slate-500 mb-6" id="deleteProgramInfo"></p>
            <div class="flex justify-end gap-3">
                <button onclick="closeDeleteModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium transition-colors">Cancel</button>
                <button id="confirmDeleteBtn" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-sm font-medium transition-colors flex items-center gap-2">
                    <i class="fas fa-trash"></i> Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="navbar_program.js"></script>

    <script>
        const SUPABASE_URL = 'https://ypynnkupszfgqoxyirff.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweW5ua3Vwc3pmZ3FveHlpcmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODYwNjcsImV4cCI6MjA5Mjk2MjA2N30.aHfVKPLM9Yr2ck6A8MAfXHishoq0JaCbVnHNMF0Okqk';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let allPrograms = [];
        let currentUserId = null;
        let deleteProgramId = null;
        let isLoggedIn = false;

        function checkLoginStatus() {
            try {
                const session = localStorage.getItem('mcb_user_session') || sessionStorage.getItem('mcb_user_session');
                if (session) {
                    const user = JSON.parse(session);
                    currentUserId = user.id;
                    isLoggedIn = true;
                    console.log("User logged in:", user.full_name);
                    return true;
                }
            } catch(e) {}
            isLoggedIn = false;
            currentUserId = null;
            return false;
        }

        function showLoginRequired() {
            document.getElementById('tableContent').innerHTML = `
                <div class="flex flex-col items-center py-16 text-slate-500">
                    <i class="fas fa-lock text-5xl mb-4 opacity-40"></i>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Login Required</h3>
                    <p class="mb-6">Please login to view and manage program records.</p>
                    <a href="../login.html" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-medium transition-colors flex items-center gap-2 no-underline">
                        <i class="fas fa-sign-in-alt"></i> Go to Login
                    </a>
                </div>`;
            document.getElementById('mobileCardView').innerHTML = '';
            document.getElementById('searchBar').classList.add('hidden');
            document.getElementById('totalPrograms').textContent = '0';
            document.getElementById('totalSundays').textContent = '0';
            document.getElementById('myPrograms').textContent = '0';
        }

        function showLoggedInContent() {
            document.getElementById('searchBar').classList.remove('hidden');
            fetchPrograms();
        }

        async function fetchPrograms() {
            const tableContent = document.getElementById('tableContent');
            const mobileView = document.getElementById('mobileCardView');
            
            tableContent.innerHTML = `<div class="flex flex-col items-center py-16"><div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div><p class="text-slate-500">Loading records...</p></div>`;
            mobileView.innerHTML = '';
            
            try {
                const { data, error } = await supabaseClient
                    .from('church_programs')
                    .select('*')
                    .eq('user_id', currentUserId)
                    .order('service_date', { ascending: false });
                
                if (error) throw error;
                
                allPrograms = data || [];
                updateStats();
                filterAndDisplay();
            } catch (err) {
                tableContent.innerHTML = `<div class="flex flex-col items-center py-16 text-slate-500"><i class="fas fa-exclamation-triangle text-4xl mb-3"></i><p>Error loading data: ${escapeHtml(err.message)}</p><button onclick="fetchPrograms()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-xl text-sm">Try Again</button></div>`;
            }
        }

        function updateStats() {
            const total = allPrograms.length;
            const sundays = allPrograms.filter(p => p.service_date && new Date(p.service_date).getDay() === 0).length;
            document.getElementById('totalPrograms').textContent = total;
            document.getElementById('totalSundays').textContent = sundays;
            document.getElementById('myPrograms').textContent = total;
        }

        function filterAndDisplay() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const dateFilter = document.getElementById('filterDate').value;
            let filtered = [...allPrograms];
            
            if (searchTerm) {
                filtered = filtered.filter(p => 
                    (p.mc_name && p.mc_name.toLowerCase().includes(searchTerm)) ||
                    (p.host_pastor_name && p.host_pastor_name.toLowerCase().includes(searchTerm))
                );
            }
            
            const today = new Date();
            today.setHours(0,0,0,0);
            if (dateFilter === 'today') {
                filtered = filtered.filter(p => p.service_date && new Date(p.service_date).toDateString() === today.toDateString());
            } else if (dateFilter === 'week') {
                const start = new Date(today);
                start.setDate(today.getDate() - today.getDay());
                const end = new Date(start);
                end.setDate(start.getDate() + 6);
                filtered = filtered.filter(p => {
                    if (!p.service_date) return false;
                    const d = new Date(p.service_date);
                    return d >= start && d <= end;
                });
            } else if (dateFilter === 'month') {
                const month = today.getMonth();
                const year = today.getFullYear();
                filtered = filtered.filter(p => {
                    if (!p.service_date) return false;
                    const d = new Date(p.service_date);
                    return d.getMonth() === month && d.getFullYear() === year;
                });
            }
            
            renderTable(filtered);
            renderMobileCards(filtered);
        }

        function renderTable(programs) {
            const container = document.getElementById('tableContent');
            if (programs.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center py-16 text-slate-400"><i class="fas fa-folder-open text-4xl mb-3"></i><p>No programs found</p></div>`;
                return;
            }
            
            let html = `<table class="w-full text-left text-sm">
                <thead class="bg-slate-50 text-slate-500 uppercase text-xs tracking-wider border-b border-slate-200">
                    <tr>
                        <th class="px-4 py-3">#</th>
                        <th class="px-4 py-3">Program ID</th>
                        <th class="px-4 py-3">MC Name</th>
                        <th class="px-4 py-3">Service Date</th>
                        <th class="px-4 py-3">Host Pastor</th>
                        <th class="px-4 py-3">Actions</th>
                    </tr>
                </thead>
                <tbody>`;
            
            programs.forEach((p, i) => {
                const id = p.program_id || 'N/A';
                const mc = p.mc_name || p.mc_name_auto || '—';
                const date = p.service_date ? new Date(p.service_date).toLocaleDateString('en-PH') : '—';
                const pastor = p.host_pastor_name || '—';
                
                html += `<tr class="border-b border-slate-100 table-row-hover transition-colors">
                    <td class="px-4 py-3 text-slate-500">${i+1}</td>
                    <td class="px-4 py-3 font-mono text-xs text-blue-600 bg-blue-50 rounded px-2 py-0.5">${escapeHtml(id)}</td>
                    <td class="px-4 py-3 font-medium text-slate-800">${escapeHtml(mc)}</td>
                    <td class="px-4 py-3 text-slate-600">${escapeHtml(date)}</td>
                    <td class="px-4 py-3 text-slate-600">${escapeHtml(pastor)}</td>
                    <td class="px-4 py-3">
                        <div class="flex gap-2">
                            <button onclick="viewProgram('${id}')" class="btn-action bg-blue-100 text-blue-700 hover:bg-blue-200"><i class="fas fa-eye"></i> View</button>
                            <button onclick="editProgram('${id}')" class="btn-action bg-amber-100 text-amber-700 hover:bg-amber-200"><i class="fas fa-edit"></i> Edit</button>
                            <button onclick="deleteProgram('${id}', '${escapeHtml(mc)}')" class="btn-action bg-red-100 text-red-700 hover:bg-red-200"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderMobileCards(programs) {
            const container = document.getElementById('mobileCardView');
            if (!container) return;
            if (programs.length === 0) {
                container.innerHTML = `<div class="col-span-full flex flex-col items-center py-10 text-slate-400"><i class="fas fa-folder-open text-3xl mb-2"></i><p>No programs found</p></div>`;
                return;
            }
            
            let html = '';
            programs.forEach((p, i) => {
                const id = p.program_id || 'N/A';
                const mc = p.mc_name || p.mc_name_auto || '—';
                const date = p.service_date ? new Date(p.service_date).toLocaleDateString('en-PH') : '—';
                const pastor = p.host_pastor_name || '—';
                
                html += `<div class="card-glass p-4 flex flex-col gap-2 bg-white">
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-mono text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${escapeHtml(id)}</span>
                        <span class="text-xs text-slate-400">#${i+1}</span>
                    </div>
                    <div class="font-semibold text-slate-800">${escapeHtml(mc)}</div>
                    <div class="text-sm text-slate-500 flex items-center gap-2"><i class="fas fa-calendar-alt"></i> ${escapeHtml(date)}</div>
                    <div class="text-sm text-slate-500 flex items-center gap-2"><i class="fas fa-user"></i> ${escapeHtml(pastor)}</div>
                    <div class="flex gap-2 mt-2 pt-2 border-t border-slate-100">
                        <button onclick="viewProgram('${id}')" class="btn-action bg-blue-100 text-blue-700 flex-1"><i class="fas fa-eye"></i> View</button>
                        <button onclick="editProgram('${id}')" class="btn-action bg-amber-100 text-amber-700 flex-1"><i class="fas fa-edit"></i> Edit</button>
                        <button onclick="deleteProgram('${id}', '${escapeHtml(mc)}')" class="btn-action bg-red-100 text-red-700 flex-1"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
        }

        window.viewProgram = (id) => window.location.href = `view_program.html?id=${id}`;
        window.editProgram = (id) => window.location.href = `./update/edit.html?id=${id}`;
        window.deleteProgram = (id, name) => {
            deleteProgramId = id;
            document.getElementById('deleteProgramInfo').innerHTML = `<strong>${escapeHtml(name)}</strong><br><span class="text-xs">ID: ${id}</span>`;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('deleteModal').classList.add('flex');
        };
        window.closeDeleteModal = () => {
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
        };

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (!deleteProgramId) return;
            try {
                await supabaseClient.from('church_programs').delete().eq('program_id', deleteProgramId).eq('user_id', currentUserId);
                closeDeleteModal();
                fetchPrograms();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        });

        document.getElementById('searchInput').addEventListener('input', filterAndDisplay);
        document.getElementById('filterDate').addEventListener('change', filterAndDisplay);
        document.getElementById('refreshBtn').addEventListener('click', fetchPrograms);
        window.fetchPrograms = fetchPrograms;

        // Initialise
        if (checkLoginStatus()) {
            showLoggedInContent();
        } else {
            showLoginRequired();
        }
    </script>
</body>
</html>
