<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Monthly Schedule | MCB Portal</title>

    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#4f46e5',
              dark: '#1e293b',
            },
            fontFamily: {
              'cinzel': ['Cinzel', 'serif'],
              'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <style>
        body {
            background: #f1f5f9;
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Removed static padding-bottom – mobile spacing is handled by navbar script */
        }

        /* Background watermark inside capture area */
        .export-container::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: url('./image/mcb.jpg') no-repeat center;
            background-size: contain;
            opacity: 0.05;
            z-index: 0;
        }

        /* Additional hover & transition – preserved from original */
        .sunday-card {
            transition: all 0.3s ease;
        }
        .sunday-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="font-jakarta text-slate-700">

    <!-- Navbar injected -->
    <div id="navbar-container"></div>

    <!-- Page Header -->
    <div class="max-w-[1000px] mx-auto mt-5 px-5 flex justify-between items-center flex-wrap gap-4">
        <div>
            <h1 class="font-cinzel text-2xl md:text-3xl font-extrabold text-dark mb-0">Monthly Schedule</h1>
            <p class="text-primary font-extrabold uppercase tracking-[2px] text-xs md:text-sm">Mobilization Church Balilihan</p>
        </div>
        <button id="downloadHD" class="bg-primary hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-full flex items-center gap-2 shadow-md shadow-indigo-300 transition-all disabled:opacity-60 disabled:cursor-not-allowed no-print">
            <i class="fas fa-download"></i> Download as Image
        </button>
    </div>

    <!-- Filter Bar -->
    <div class="max-w-[1000px] mx-auto mt-5 px-5 py-4 bg-white rounded-2xl flex flex-wrap gap-4 items-center justify-between shadow-sm no-print">
        <div class="flex items-center gap-3">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider"><i class="fas fa-filter mr-1"></i> Filter by:</span>
            <select id="filterType" class="bg-white border border-slate-200 rounded-xl py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50">
                <option value="all">📅 All Programs</option>
                <option value="month">📆 Select Month</option>
                <option value="week">📊 Select Week</option>
            </select>
        </div>

        <div id="monthSelectGroup" class="hidden flex items-center gap-3">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Month:</span>
            <select id="monthSelect" class="bg-white border border-slate-200 rounded-xl py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50">
                <option value="1">January</option><option value="2">February</option><option value="3">March</option>
                <option value="4">April</option><option value="5">May</option><option value="6">June</option>
                <option value="7">July</option><option value="8">August</option><option value="9">September</option>
                <option value="10">October</option><option value="11">November</option><option value="12">December</option>
            </select>
        </div>

        <div id="weekSelectGroup" class="hidden flex items-center gap-3">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Week:</span>
            <select id="weekSelect" class="bg-white border border-slate-200 rounded-xl py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50">
                <option value="1">Week 1 (Days 1-7)</option>
                <option value="2">Week 2 (Days 8-14)</option>
                <option value="3">Week 3 (Days 15-21)</option>
                <option value="4">Week 4 (Days 22-28)</option>
                <option value="5">Week 5 (Days 29-31)</option>
            </select>
        </div>

        <div>
            <span id="filterBadge" class="bg-primary text-white text-xs font-semibold px-3 py-1 rounded-full">Showing: All Programs</span>
        </div>
    </div>

    <!-- Export Container -->
    <div id="captureArea" class="export-container relative w-full max-w-[1000px] mx-auto mt-5 bg-white p-8 md:p-10 rounded-2xl shadow-2xl overflow-hidden">
        <!-- Schedule Header -->
        <div class="text-center mb-10 relative z-10">
            <img src="./image/mcb.jpg" width="80" alt="MCB Logo" class="rounded-full mx-auto mb-3" onerror="this.src='https://ui-avatars.com/api/?name=MCB&background=4f46e5&color=fff&size=80&bold=true'">
            <h1 class="font-cinzel text-4xl md:text-5xl font-extrabold text-dark mb-1">Monthly Schedule</h1>
            <p class="text-primary font-extrabold uppercase tracking-[2px] text-sm">Mobilization Church Balilihan</p>
            <div id="filterDisplay" class="mt-2 text-sm font-semibold text-primary"></div>
        </div>

        <!-- Programs Grid – replicates original 'monthly-grid' -->
        <div id="programsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 relative z-10">
            <!-- Loading placeholder -->
            <div class="col-span-full flex flex-col items-center py-12 bg-white rounded-2xl">
                <div class="w-10 h-10 border-4 border-blue-200 border-t-primary rounded-full animate-spin mb-3"></div>
                <p class="text-slate-500">Loading programs...</p>
            </div>
        </div>

        <!-- Footer branding -->
        <div class="mt-12 pt-5 border-t-2 border-slate-100 text-center text-xs text-slate-400 relative z-10">
            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <span>MCB Portal Pro</span>
                <span>System User: <strong id="userName" class="text-slate-600">Loading...</strong></span>
                <span>UID: #<span id="userId" class="text-slate-600">---</span></span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="navbar_program.js"></script>

    <script>
        const SUPABASE_URL = 'https://ypynnkupszfgqoxyirff.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlweW5ua3Vwc3pmZ3FveHlpcmZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODYwNjcsImV4cCI6MjA5Mjk2MjA2N30.aHfVKPLM9Yr2ck6A8MAfXHishoq0JaCbVnHNMF0Okqk';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUserId = null;
        let currentUserFullName = null;
        let allPrograms = [];
        let currentFilter = 'all';
        let currentMonth = new Date().getMonth() + 1;
        let currentWeek = 1;
        
        // Get current user from session
        async function getCurrentUser() {
            try {
                const session = localStorage.getItem('mcb_user_session') || sessionStorage.getItem('mcb_user_session');
                if (session) {
                    const user = JSON.parse(session);
                    currentUserId = user.id;
                    currentUserFullName = user.full_name || user.name || 'Church Member';
                    
                    document.getElementById('userName').innerText = currentUserFullName;
                    document.getElementById('userId').innerText = String(currentUserId).padStart(5, '0');
                    
                    const { data } = await supabaseClient
                        .from('church_users')
                        .select('full_name')
                        .eq('id', currentUserId)
                        .single();
                    
                    if (data && data.full_name) {
                        currentUserFullName = data.full_name;
                        document.getElementById('userName').innerText = currentUserFullName;
                    }
                    
                    return true;
                }
            } catch(e) {
                console.log("Error reading session:", e);
            }
            
            document.getElementById('userName').innerText = 'Guest';
            document.getElementById('userId').innerText = '---';
            return false;
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return 'TBA';
            try {
                return new Date(dateStr).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch(e) {
                return dateStr;
            }
        }
        
        function formatShortDate(dateStr) {
            if (!dateStr) return 'TBA';
            try {
                return new Date(dateStr).toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
            } catch(e) {
                return dateStr;
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function getWeekOfMonth(date) {
            const day = date.getDate();
            if (day <= 7) return 1;
            if (day <= 14) return 2;
            if (day <= 21) return 3;
            if (day <= 28) return 4;
            return 5;
        }
        
        function filterPrograms() {
            const filterType = document.getElementById('filterType').value;
            let filtered = [...allPrograms];
            let filterText = '';
            
            if (filterType === 'month') {
                const selectedMonth = parseInt(document.getElementById('monthSelect').value);
                currentMonth = selectedMonth;
                filtered = allPrograms.filter(p => {
                    if (!p.service_date) return false;
                    const date = new Date(p.service_date);
                    return date.getMonth() + 1 === selectedMonth;
                });
                const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                filterText = `Month: ${monthNames[selectedMonth - 1]}`;
                document.getElementById('filterBadge').innerHTML = `Showing: ${monthNames[selectedMonth - 1]}`;
            } 
            else if (filterType === 'week') {
                const selectedWeek = parseInt(document.getElementById('weekSelect').value);
                currentWeek = selectedWeek;
                filtered = allPrograms.filter(p => {
                    if (!p.service_date) return false;
                    const date = new Date(p.service_date);
                    return getWeekOfMonth(date) === selectedWeek;
                });
                filterText = `Week ${selectedWeek} of Month`;
                document.getElementById('filterBadge').innerHTML = `Showing: Week ${selectedWeek}`;
            } 
            else {
                filterText = 'All Programs';
                document.getElementById('filterBadge').innerHTML = 'Showing: All Programs';
            }
            
            // Sort by date
            filtered.sort((a, b) => new Date(a.service_date) - new Date(b.service_date));
            
            document.getElementById('filterDisplay').innerHTML = filterText ? `<i class="fas fa-calendar-alt mr-1"></i> ${filterText}` : '';
            
            displayPrograms(filtered);
        }
        
        function displayPrograms(programs) {
            const container = document.getElementById('programsContainer');
            
            if (programs.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center py-16 bg-white rounded-2xl text-slate-500">
                        <i class="fas fa-calendar-day text-4xl mb-3 opacity-50"></i>
                        <h5 class="text-lg font-bold text-slate-700 mb-1">No Programs Found</h5>
                        <p class="text-sm mb-4">No Sunday programs available for the selected filter.</p>
                        <a href="add_program.html" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-indigo-700 transition-colors">Add New Program</a>
                    </div>
                `;
                return;
            }
            
            let html = '';
            
            programs.forEach(program => {
                const shortDate = formatShortDate(program.service_date);
                const mcName = program.mc_name || program.mc_name_auto || 'TBA';
                const speaker = program.host_pastor_name || 'TBA';
                
                html += `
                    <div class="sunday-card bg-white/80 backdrop-blur-sm border border-slate-200 rounded-2xl p-5 hover:shadow-md">
                        <span class="inline-block bg-primary text-white text-xs font-bold px-4 py-1 rounded-full mb-4">
                            <i class="far fa-calendar-alt mr-2"></i>${escapeHtml(shortDate)}
                        </span>
                        <div class="flex justify-between items-center py-2 border-b border-dashed border-slate-200">
                            <span class="text-xs font-bold text-slate-400 uppercase">Master of Ceremony</span>
                            <span class="text-sm font-semibold text-slate-800">${escapeHtml(mcName)}</span>
                        </div>
                        <div class="flex justify-between items-center py-2">
                            <span class="text-xs font-bold text-slate-400 uppercase">Host Pastor and Elders</span>
                            <span class="text-sm font-semibold text-slate-800">${escapeHtml(speaker)}</span>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        async function fetchPrograms() {
            const container = document.getElementById('programsContainer');
            
            if (!currentUserId) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center py-16 bg-white rounded-2xl text-slate-500">
                        <i class="fas fa-lock text-4xl mb-3 opacity-50"></i>
                        <h5 class="text-lg font-bold text-slate-700 mb-1">Login Required</h5>
                        <p class="text-sm mb-4">Please login to view your monthly schedule.</p>
                        <a href="../login.html" class="bg-primary text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-indigo-700 transition-colors">Go to Login</a>
                    </div>
                `;
                return;
            }
            
            try {
                const { data, error } = await supabaseClient
                    .from('church_programs')
                    .select('*')
                    .eq('user_id', currentUserId)
                    .order('service_date', { ascending: true });
                
                if (error) throw error;
                
                allPrograms = data || [];
                filterPrograms();
                
            } catch (err) {
                console.error('Fetch error:', err);
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center py-16 bg-white rounded-2xl text-slate-500">
                        <i class="fas fa-exclamation-triangle text-4xl mb-3 opacity-50"></i>
                        <h5 class="text-lg font-bold text-slate-700 mb-1">Error Loading Data</h5>
                        <p class="text-sm mb-4">${err.message}</p>
                        <button class="bg-primary text-white px-4 py-2 rounded-full text-sm font-semibold hover:bg-indigo-700 transition-colors" onclick="fetchPrograms()">Try Again</button>
                    </div>
                `;
            }
        }
        
        // Filter change handlers
        function setupFilters() {
            const filterType = document.getElementById('filterType');
            const monthGroup = document.getElementById('monthSelectGroup');
            const weekGroup = document.getElementById('weekSelectGroup');
            const monthSelect = document.getElementById('monthSelect');
            const weekSelect = document.getElementById('weekSelect');
            
            filterType.addEventListener('change', function() {
                currentFilter = this.value;
                
                if (this.value === 'month') {
                    monthGroup.style.display = 'flex';
                    weekGroup.style.display = 'none';
                    filterPrograms();
                } else if (this.value === 'week') {
                    monthGroup.style.display = 'none';
                    weekGroup.style.display = 'flex';
                    filterPrograms();
                } else {
                    monthGroup.style.display = 'none';
                    weekGroup.style.display = 'none';
                    filterPrograms();
                }
            });
            
            monthSelect.addEventListener('change', filterPrograms);
            weekSelect.addEventListener('change', filterPrograms);
            
            // Set current month as default
            const currentMonthValue = new Date().getMonth() + 1;
            monthSelect.value = currentMonthValue;
        }
        
        // Download HD Image
        async function downloadHDImage() {
            const btn = document.getElementById('downloadHD');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            const captureElement = document.getElementById('captureArea');
            
            try {
                const canvas = await html2canvas(captureElement, {
                    scale: 3,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: "#ffffff",
                    logging: false
                });
                
                const link = document.createElement('a');
                const date = new Date();
                const monthYear = date.toLocaleDateString('en-PH', { month: 'short', year: 'numeric' });
                link.download = `MCB_Schedule_${monthYear}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
                
            } catch (err) {
                console.error('Capture error:', err);
                alert('Error capturing image. Please try again.');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        // Initialize
        async function init() {
            await getCurrentUser();
            setupFilters();
            await fetchPrograms();
            
            document.getElementById('downloadHD').addEventListener('click', downloadHDImage);
        }
        
        init();
    </script>
</body>
</html>
